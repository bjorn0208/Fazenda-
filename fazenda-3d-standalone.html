  ctx.fill();
  ctx.fillStyle = '#e91e63';
  ctx.beginPath();
  ctx.arc(dir * -10.5, -7 + bob * 0.4, 0.8, 0, Math.PI * 2);
  ctx.arc(dir * -7.5, -7 + bob * 0.4, 0.8, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#e8e4dc';
  ctx.lineWidth = 2;
  ctx.beginPath();

/* ================= CACHORRO PASTOR ================= */

function dogWalkable(x, y) {
  return inBounds(x, y) && inOwnedArea(x, y) && !occupancy[occIndex(x, y)];
}

function dogWalkTo(d, tx, ty) {
  d.path = gridPath(Math.floor(d.gx), Math.floor(d.gy), tx, ty, dogWalkable) || [];
  d.tx = tx + 0.5;
  d.ty = ty + 0.5;
  if (d.path.length) {
    const w = d.path.shift();
    d.tx = w.x + 0.5;
    d.ty = w.y + 0.5;
  }
  d.walking = true;
}

function updateDogs(dt) {
  for (const d of game.dogs) updateDogOne(d, dt);
}

function updateDogOne(d, dt) {
  d.phase += dt;
  if (d.walking) {
    const dx = d.tx - d.gx, dy = d.ty - d.gy;
    const sdx = dx - dy, sdy = (dx + dy) * 0.5;
    if (sdx * sdx + sdy * sdy > 1e-6) {
      d.face = lerpAngle(d.face || 0, Math.atan2(sdy, sdx), Math.min(1, dt * 8));
      const fx = Math.cos(d.face);
      if (Math.abs(fx) >= 0.15) d.lastDir = fx >= 0 ? 1 : -1;
    }
    const dist = Math.hypot(dx, dy);
    const step = 3.4 * dt;
    if (dist <= step) {
      d.gx = d.tx; d.gy = d.ty;
      if (d.path && d.path.length) {
        const w = d.path.shift();
        d.tx = w.x + 0.5; d.ty = w.y + 0.5;
      } else {
        d.walking = false;
        d.wait = 0.2;
      }
    } else {
      d.gx += dx / dist * step;
      d.gy += dy / dist * step;
    }
    return;
  }
  d.wait -= dt;
  if (d.wait > 0) return;
  if (game.pen) {
    const phase = dayPhase();
    const mode = d.active ? 'herd' : (phase === 'night' ? 'herd' : ((phase === 'dawn' || phase === 'day') ? 'release' : null));
    if (mode) {
      const wantInside = mode === 'herd';
      d.barkT = (d.barkT === undefined ? 0 : d.barkT) - dt;
      const claimed = new Set();
      for (const o of game.dogs) if (o !== d && o.targetA) claimed.add(o.targetA);
      let best = null, bestD = Infinity;
      for (const a of game.animals) {
        if (a.herdStage) continue;
        if (inPen(a) === wantInside) continue;
        const dist = Math.hypot(a.gx - d.gx, a.gy - d.gy);
        if (dist <= 10 && d.barkT <= 0) {
          if (wantInside) herdAnimal(a); else releaseAnimal(a);
        }
        if (claimed.has(a)) continue;
        if (dist < bestD) { bestD = dist; best = a; }
      }
      d.targetA = best || null;
      if (d.barkT <= 0) d.barkT = 1.2;
      if (best) {
        if (bestD < 1.3) {
          if (wantInside) herdAnimal(best); else releaseAnimal(best);
          d.wait = 0.4;
        } else {
          dogWalkTo(d, Math.floor(best.gx), Math.floor(best.gy));
        }
        return;
      }
    }
  }
  const home = (!d.active && dayPhase() !== 'night') ? doghouseSpot() : null;
  if (home) {
    d.resting = true;
    if (Math.hypot(home.x + 0.5 - d.gx, home.y + 0.5 - d.gy) > 0.6) {
      dogWalkTo(d, home.x, home.y);
    } else {
      d.walking = false;
      d.wait = 2 + Math.random() * 3;
    }
    return;
  }
  d.resting = false;

  const cx = Math.floor(d.gx), cy = Math.floor(d.gy);
  const opts = [];
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    if (dogWalkable(cx + dx, cy + dy)) opts.push([cx + dx, cy + dy]);
  }
  if (opts.length) {
    const [nx, ny] = opts[Math.floor(Math.random() * opts.length)];
    dogWalkTo(d, nx, ny);
  } else {
    d.wait = 2;
  }
}

function drawDog(ctx, cam, cw, ch, d) {
  const p = projectPoint(d.gx, d.gy, 0);
  const s = worldToScreen(cam, p.x, p.y, cw, ch);
  const z = cam.zoom;

  const face = d.face || 0;

  const dir = Math.abs(fx) < 0.15 ? (d.lastDir || 1) : (fx >= 0 ? 1 : -1);

  ctx.save();

  ctx.lineTo(dir * 12.5, -21.5 + bob);

  ctx.arc(dir * 8.5, -13.5 + bob, 3.2, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();

  if (d.resting && !d.walking) {
    ctx.font = Math.max(9, 11 * z) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.75;
    ctx.fillText('💤', s.x + 10 * z, s.y - 26 * z + Math.sin(d.phase * 2) * 2 * z);
    ctx.globalAlpha = 1;
  }
}

function mindLang() {
  return (game.settings && game.settings.language) === 'en-US' ? 'en-US' : 'pt-BR';
}

function mindLine(pool) {
  const book = MIND_LINES[mindLang()];
  const arr = (book && book[pool]) || MIND_LINES['pt-BR'][pool] || ['...'];
  return arr[Math.floor(Math.random() * arr.length)];
}

function mindFmt(pool, params) {
  let txt = mindLine(pool);
  for (const k in (params || {})) txt = txt.split('{' + k + '}').join(params[k]);
  return txt;
}

const SHIRT_PALETTE = ['#c62828', '#d81b60', '#8e24aa', '#5e35b1', '#1e88e5', '#00897b', '#43a047', '#f4511e', '#6d4c41', '#ad1457', '#ef6c00', '#7cb342'];

/* ---------- Reuniao matinal dos fazendeiros ---------- */
function meetingPoint() {
  const door = houseDoorTile();
  if (door) return door;
  const a = game.ownedArea;
  return { x: a.x0 + 2, y: a.y0 + 2 };
}

function farmerChestTotal(f) {
  let n = 0;
  for (const k in (f.chest || {})) n += f.chest[k];
  return n;
}

function startMeetingDiscussion() {
  const farmers = game.farmers.filter(f => !f.inside);
  if (!farmers.length) return;
  const script = [];
  const leader = farmers[Math.floor(Math.random() * farmers.length)];
  const totals = {};
  for (const f of farmers) {
    for (const k in (f.chest || {})) totals[k] = (totals[k] || 0) + f.chest[k];
  }
  const types = Object.keys(totals).filter(k => totals[k] > 0);
  const chosen = types.length ? types[Math.floor(Math.random() * types.length)] : null;
  script.push({ f: leader, text: mindFmt('meetOpen') });
  if (chosen) {
    script.push({ f: leader, text: mindFmt('meetPlan', { crop: t('c_' + chosen), n: totals[chosen] }) });
    const holder = farmers.find(f => f !== leader && (f.chest[chosen] || 0) > 0);
    if (holder) script.push({ f: holder, text: mindFmt('meetHave', { n: holder.chest[chosen], crop: t('c_' + chosen) }) });
  }
  const broke = farmers.find(f => farmerChestTotal(f) === 0);
  if (broke) {
    const rich = farmers.filter(f => f !== broke && farmerChestTotal(f) >= 3)
      .sort((a, b) => farmerChestTotal(b) - farmerChestTotal(a))[0];
    if (rich && chosen && (rich.chest[chosen] || 0) > 0) {
      script.push({ f: broke, text: mindFmt('meetBorrow', { other: rich.name, crop: t('c_' + chosen) }) });
      script.push({ f: rich, text: mindFmt('meetLend', { other: broke.name }) });
      const give = Math.min(3, rich.chest[chosen]);
      rich.chest[chosen] -= give;
      if (rich.chest[chosen] <= 0) delete rich.chest[chosen];
      broke.chest[chosen] = (broke.chest[chosen] || 0) + give;
    } else {
      script.push({ f: broke, text: mindFmt('meetNoSeeds') });
    }
  }
  const closer = farmers[farmers.length - 1];
  if (closer !== leader) script.push({ f: closer, text: mindFmt('meetClose') });
  game.meetingScript = script.map((l, i) => ({ f: l.f, text: l.text, at: 1.2 + i * 2.6 }));
  game.meetingT = 0;
}

function updateMeeting(dt) {
  if (game.meetingDone) return;
  const Hm = gameHour();
  if (Hm < 7.5 || Hm >= 19 || !game.farmers.length) return;
  const point = meetingPoint();
  let allHere = true;
  for (const f of game.farmers) {
    farmerEnsureMind(f);
    if (f.inside) continue;
    const d = Math.hypot(point.x + 0.5 - f.gx, point.y + 0.5 - f.gy);
    if (d > 1.8) {
      allHere = false;
      if (!f.walking) {
        f.riding = false;
        f.tx = point.x + 0.5 + (Math.random() * 1.6 - 0.8);
        f.ty = point.y + 0.5 + (Math.random() * 1.6 - 0.8);
        f.walking = true;
      }
    }
  }
  game.meetingWait = (game.meetingWait || 0) + dt;
  if (allHere || game.meetingWait > 20) {
    game.meetingDone = true;
    game.meetingWait = 0;
    startMeetingDiscussion();
  }
}

function farmerTargetBusy(f, x, y) {
  for (const o of game.farmers) {
    if (o === f || o.inside) continue;
    const sx = o.jobSpot ? o.jobSpot.x : o.gx;
    const sy = o.jobSpot ? o.jobSpot.y : o.gy;
    if (Math.hypot(sx - x, sy - y) < 10) return true;
  }
  return false;
}

function farmerEnsureMind(f) {
  if (f.name) return;
  f.name = f.isPlayer ? (game.playerName || 'Fazendeiro') : FARMER_NAMES[(f.id || 0) % FARMER_NAMES.length];
  const keys = Object.keys(PERSONALITIES);
  f.pers = keys[Math.floor(Math.random() * keys.length)];
  f.mood = (PERSONALITIES[f.pers] || {}).mood || 'feliz';
  f.energy = 70 + Math.random() * 30;
  f.friend = {};
  f.thoughtT = 3 + Math.random() * 8;
  f.chatT = 8 + Math.random() * 15;
  f.bubble = null;
  f.thoughtLog = [];
  f.shirt = f.isPlayer ? '#2e7d32' : SHIRT_PALETTE[(f.id || 0) % SHIRT_PALETTE.length];
  f.shirtDark = shadeColor(f.shirt, 0.62);
  f.barTonight = Math.random() < 0.65;
  f.barDone = false;
  f.atBar = false;
  f.barT = 0;
}

function barSpotFor(f, bar) {
  const cands = [];
  for (let x = bar.gx; x < bar.gx + 3; x++) {
    if (inBounds(x, bar.gy + 2) && inOwnedArea(x, bar.gy + 2) && !occupancy[occIndex(x, bar.gy + 2)]) cands.push({ x, y: bar.gy + 2 });
  }
  for (const [x, y] of [[bar.gx - 1, bar.gy + 1], [bar.gx + 3, bar.gy + 1]]) {
    if (inBounds(x, y) && inOwnedArea(x, y) && !occupancy[occIndex(x, y)]) cands.push({ x, y });
  }
  if (!cands.length) return { x: bar.gx + 1, y: bar.gy + 2 };
  return cands[(f.id || 0) % cands.length];
}

function restaurantSpotFor(f, rest) {
  const cands = [];
  for (let x = rest.gx; x < rest.gx + 2; x++) {
    if (inBounds(x, rest.gy + 2) && inOwnedArea(x, rest.gy + 2) && !occupancy[occIndex(x, rest.gy + 2)]) cands.push({ x, y: rest.gy + 2 });
  }
  for (const [x, y] of [[rest.gx - 1, rest.gy + 1], [rest.gx + 2, rest.gy + 1]]) {
    if (inBounds(x, y) && inOwnedArea(x, y) && !occupancy[occIndex(x, y)]) cands.push({ x, y });
  }
  if (!cands.length) return { x: rest.gx, y: rest.gy + 2 };
  return cands[(f.id || 0) % cands.length];
}

function farmerSay(f, text, dur) {
  f.bubble = { text, until: performance.now() + (dur || 4200) };
  f.thoughtLog = f.thoughtLog || [];
  f.thoughtLog.unshift(text);
  if (f.thoughtLog.length > 6) f.thoughtLog.length = 6;
}

function farmerThink(f) {
  if (f.atBar) { farmerSay(f, mindLine('bar'), 4200); return; }
  if (f.inside) { farmerSay(f, mindLine('night'), 4200); return; }
  const phase = dayPhase();
  let pool = 'idle';
  if (phase === 'dawn') pool = 'dawn';
  else if ((f.energy || 100) < 25) pool = 'tired';
  else if (phase === 'day' && Object.keys(f.chest || {}).length === 0) pool = 'chestEmpty';
  else if (phase === 'day') pool = 'work';
  else if (phase === 'afternoon') pool = 'harvest';
  farmerSay(f, mindLine(pool).replace('{farm}', game.farmName).replace('{other}', ''), 4200);
}

function farmerChat(a, b) {
  farmerSay(a, mindLine('greet').replace('{other}', b.name), 4500);
  const replyPool = Math.random() < 0.3 ? 'joke' : 'reply';
  farmerSay(b, mindLine(replyPool).replace('{other}', a.name), 4500);
  a.friend = a.friend || {};
  b.friend = b.friend || {};
  a.friend[b.id] = Math.min(100, (a.friend[b.id] || 0) + 2);
  b.friend[a.id] = Math.min(100, (b.friend[a.id] || 0) + 2);
  a.chatT = 20 + Math.random() * 25;
  b.chatT = 20 + Math.random() * 25;
  if ((PERSONALITIES[a.pers] || {}).chat > 0.7) a.mood = 'animado';
  if (a.pers === 'rabugento') a.mood = 'irritado';
}

function farmerWorkCost(f, n) {
  f.energy = Math.max(0, (f.energy || 100) - (n || 2));
  if (f.energy < 25) f.mood = 'cansado';
  else if (f.mood === 'cansado') f.mood = (PERSONALITIES[f.pers] || {}).mood || 'feliz';
}

function farmerWorkMul(f) {
  return (PERSONALITIES[f.pers] || {}).workMul || 1;
}

function farmerWalkable(x, y) {
  return inBounds(x, y) && inOwnedArea(x, y) && !occupancy[occIndex(x, y)];
}

function farmerFindWaterTarget(f) {
  let best = null, bestD = Infinity;
  let bestFree = null, bestFreeD = Infinity;
  for (const c of game.crops) {
    if (c.watered || cropProgress(c) >= 1) continue;
    const d = Math.hypot(c.gx + 0.5 - f.gx, c.gy + 0.5 - f.gy);
    if (d < bestD) { bestD = d; best = c; }
    if (d < bestFreeD && !farmerTargetBusy(f, c.gx, c.gy)) { bestFreeD = d; bestFree = c; }
  }
  return bestFree || best;
}

function hasHorse() {
  return game.animals.some(a => a.kind === 'horse' && isAdult(a));
}

/* Escolhe o proximo trabalho respeitando a fase do dia e a funcao do fazendeiro. */
function farmerFindJob(f) {
  const role = f.role || 'all';
  const H = gameHour();
  if (H >= 19 || H < 8.5) return null;
  if (role !== 'animal') {
    for (const type of Object.keys(f.chest)) {
      if (f.chest[type] > 0 && farmerFindPlantSpot(f, type)) return { kind: 'plant', type };
    }
    let best = null, bestD = Infinity;
    let bestFree = null, bestFreeD = Infinity;
    for (const c of game.crops) {
      if (cropProgress(c) < 1) continue;
      const d = Math.hypot(c.gx + 0.5 - f.gx, c.gy + 0.5 - f.gy);
      if (d < bestD) { bestD = d; best = c; }
      if (d < bestFreeD && !farmerTargetBusy(f, c.gx, c.gy)) { bestFreeD = d; bestFree = c; }
    }
    best = bestFree || best;
    if (best) return { kind: 'harvest', target: best };
    const dry = farmerFindWaterTarget(f);
    if (dry) return { kind: 'water', target: dry };
  }
  if (role !== 'plant') {
    let an = null;
    let bestD = Infinity;
    for (const a of game.animals) {
      const ready = pigReady(a) || a.product > 0;
      if (!ready) continue;
      const d = Math.hypot(a.gx - f.gx, a.gy - f.gy);
      if (d < bestD) { bestD = d; an = a; }
    }
    if (an) return { kind: 'animal', target: an };
  }
  return null;
}

function farmerFindPlantSpot(f, type) {
  const a = game.ownedArea;
  const candidates = new Set();
  for (const c of game.crops) {
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const x = c.gx + dx, y = c.gy + dy;
      if (inBounds(x, y) && inOwnedArea(x, y) && !occupancy[occIndex(x, y)] && isTilled(x, y)) {
        candidates.add(x + ',' + y);
      }
    }
  }
  let best = null, bestScore = -Infinity;
  for (const key of candidates) {
    const [x, y] = key.split(',').map(Number);
    const d = Math.hypot(x + 0.5 - f.gx, y + 0.5 - f.gy);
    let score = -d;
    if (!farmerTargetBusy(f, x, y)) score += 8;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nb = occupancy[occIndex(x + dx, y + dy)];
      if (nb && nb.isCrop) score += (nb.type === type ? 20 : 5);
    }
    if (score > bestScore) { bestScore = score; best = { x, y }; }
  }
  if (best) return best;
  for (let tries = 0; tries < 60; tries++) {
    const x = a.x0 + Math.floor(Math.random() * (a.x1 - a.x0 + 1));
    const y = a.y0 + Math.floor(Math.random() * (a.y1 - a.y0 + 1));
    if (!occupancy[occIndex(x, y)] && isTilled(x, y)) return { x, y };
  }
  return null;
}

function houseDoorTile() {
  const b = game.buildings.find(x => x.type === 'house');
  if (!b) return null;
  const cands = [[b.gx + 1, b.gy + 3], [b.gx, b.gy + 3], [b.gx + 2, b.gy + 3], [b.gx + 3, b.gy + 1], [b.gx - 1, b.gy + 1]];
  for (const [x, y] of cands) {
    if (farmerWalkable(x, y)) return { x, y };
  }
  return { x: b.gx + 1, y: b.gy + 3 };
}

function updateFarmers(dt) {
  if (game.intro) return;
  updateMeeting(dt);
  if (game.meetingScript && game.meetingScript.length) {
    game.meetingT += dt;
    while (game.meetingScript.length && game.meetingT >= game.meetingScript[0].at) {
      const line = game.meetingScript.shift();
      farmerSay(line.f, line.text, 5000);
    }
  }
  for (const f of game.farmers) {
    f.phase += dt;
    farmerEnsureMind(f);

    f.thoughtT -= dt;
    if (f.thoughtT <= 0) {
      f.thoughtT = 14 + Math.random() * 18;
      if (!f.bubble || performance.now() > f.bubble.until) farmerThink(f);
    }
    f.chatT -= dt;
    if (f.chatT <= 0) {
      f.chatT = 12 + Math.random() * 20;
      if (!f.walking && !f.inside) {
        for (const o of game.farmers) {
          if (o === f || o.inside || o.walking) continue;
          if (Math.hypot(o.gx - f.gx, o.gy - f.gy) < 1.8) { farmerChat(f, o); break; }
        }
      }
    }

    if (f.inside) {
      const Hw = gameHour();
      if (Hw >= 7.5 && Hw < 19) {
        f.inside = false;
        f.wait = 0.5;
        f.barTonight = Math.random() < 0.65;
        f.barDone = false;
        f.atBar = false;
        f.barT = 0;
      }
      else {
        f.energy = Math.min(100, (f.energy || 60) + 40 * dt);
        f.mood = (PERSONALITIES[f.pers] || {}).mood || 'feliz';
        if (f.bubble && performance.now() > f.bubble.until) f.bubble = null;
      }
      continue;
    }

    if (f.walking) {
      const dx = f.tx - f.gx, dy = f.ty - f.gy;
      const sdx = dx - dy, sdy = (dx + dy) * 0.5;
      if (sdx * sdx + sdy * sdy > 1e-6) {
        f.face = lerpAngle(f.face || 0, Math.atan2(sdy, sdx), Math.min(1, dt * 6));
        const fx = Math.cos(f.face);
        if (Math.abs(fx) >= 0.15) f.lastDir = fx >= 0 ? 1 : -1;
      }
      const dist = Math.hypot(dx, dy);
      const step = FARMER_SPEED * farmerWorkMul(f) * (f.riding ? 2.5 : 1) * dt;
      if (dist <= step) {
        f.gx = f.tx; f.gy = f.ty;
        f.walking = false;
        f.wait = 0.3;
      } else {
        f.gx += dx / dist * step;
        f.gy += dy / dist * step;
      }
      continue;
    }

    f.wait -= dt;
    if (f.wait > 0) continue;

    const H = gameHour();

    if (H >= 12 && H < 13) {
      const rest = game.buildings.find(b => b.type === 'restaurant');
      if (rest) {
        const spot = restaurantSpotFor(f, rest);
        if (Math.hypot(spot.x + 0.5 - f.gx, spot.y + 0.5 - f.gy) < 0.7) {
          f.walking = false;
          f.riding = false;
          f.energy = Math.min(100, (f.energy || 60) + 28 * dt);
          f.wait = 0.5;
          if (Math.random() < dt * 0.2) spawnFloater(spot.x, spot.y, '\uD83C\uDF7D', '#ffcc80');
        } else {
          f.riding = false;
          f.tx = spot.x + 0.5;
          f.ty = spot.y + 0.5;
          f.walking = true;
        }
      }
      continue;
    }

    if (!game.meetingDone && H >= 7.5 && H < 19) continue;

    if (H >= 19 || H < 7.5) {
      const bar = game.buildings.find(b => b.type === 'bar');
      if (bar && f.barTonight && !f.barDone && (H >= 19 || H < 3)) {
        f.atBar = true;
        const spot = barSpotFor(f, bar);
        if (Math.hypot(spot.x + 0.5 - f.gx, spot.y + 0.5 - f.gy) < 0.7) {
          f.walking = false;
          f.riding = false;
          f.energy = Math.min(100, (f.energy || 60) + 22 * dt);
          f.wait = 0.5;
          f.barT = (f.barT || 0) + dt;
          if (Math.random() < dt * 0.25) farmerSay(f, mindLine('bar'), 4500);
          if (f.barT > 40 || (H >= 3 && H < 19)) f.barDone = true;
        } else {
          f.riding = false;
          f.tx = spot.x + 0.5;
          f.ty = spot.y + 0.5;
          f.walking = true;
        }
        continue;
      }
      const door = houseDoorTile();
      if (door) {
        if (Math.hypot(door.x + 0.5 - f.gx, door.y + 0.5 - f.gy) < 0.9) {
          f.inside = true;
          f.walking = false;
          f.riding = false;
        } else {
          f.riding = false;
          f.tx = door.x + 0.5;
          f.ty = door.y + 0.5;
          f.walking = true;
        }
        continue;
      }
    }
    if (H < 8.5 || H >= 19) continue;
    const job = farmerFindJob(f);

    if (job && job.kind === 'water') {
      const c = job.target;
      if (Math.hypot(c.gx + 0.5 - f.gx, c.gy + 0.5 - f.gy) < 0.9) {
        if (waterCrop(c)) { spawnFloater(c.gx, c.gy, '💧', '#4fc3f7'); farmerWorkCost(f); }
        f.wait = 0.4;
      } else {
        f.riding = false;
        f.tx = c.gx + 0.5; f.ty = c.gy + 0.5;
        f.walking = true;
      }
      continue;
    }

    if (job && job.kind === 'harvest') {
      const c = job.target;
      if (Math.hypot(c.gx + 0.5 - f.gx, c.gy + 0.5 - f.gy) < 0.9) {
        const r = harvestCrop(c);
        if (r) {
          const val = r.def.sell;
          addCoins(val);
          spawnFloater(c.gx, c.gy, '+' + val + ' 🪙', '#ffd54f');
          farmerWorkCost(f);
        }
        f.riding = false;
        f.wait = 0.4;
      } else {
        f.riding = hasHorse() && Math.hypot(c.gx + 0.5 - f.gx, c.gy + 0.5 - f.gy) > 5;
        f.tx = c.gx + 0.5; f.ty = c.gy + 0.5;
        f.walking = true;
      }
      continue;
    }

    if (job && job.kind === 'animal') {
      const a = job.target;
      if (Math.hypot(a.gx - f.gx, a.gy - f.gy) < 1.4) {
        if (collectAnimal(a)) farmerWorkCost(f);
        f.wait = 0.5;
      } else {
        f.riding = false;
        f.tx = a.gx; f.ty = a.gy;
        f.walking = true;
      }
      continue;
    }

    if (job && job.kind === 'plant') {
      let spot = f.jobSpot;
      if (!spot || occupancy[occIndex(spot.x, spot.y)]) {
        spot = farmerFindPlantSpot(f, job.type);
        if (!spot) { f.wait = 2; continue; }
        f.jobSpot = spot;
        f.jobType = job.type;
      }
      if (Math.hypot(spot.x + 0.5 - f.gx, spot.y + 0.5 - f.gy) < 0.9) {
        const crop = plantCrop(job.type, spot.x, spot.y, true);
        f.jobSpot = null;
        if (crop) {
          f.chest[job.type]--;
          if (f.chest[job.type] <= 0) delete f.chest[job.type];
          waterCrop(crop);
          spawnFloater(spot.x, spot.y, '🌱', '#aed581');
          farmerWorkCost(f);
        }
        f.wait = 0.5;
      } else {
        f.riding = false;
        f.tx = spot.x + 0.5; f.ty = spot.y + 0.5;
        f.walking = true;
      }
      continue;
    }

    const cx = Math.floor(f.gx), cy = Math.floor(f.gy);
    const opts = [];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      if (farmerWalkable(cx + dx, cy + dy)) opts.push([cx + dx, cy + dy]);
    }
    if (opts.length) {
      const [nx, ny] = opts[Math.floor(Math.random() * opts.length)];
      f.tx = nx + 0.5; f.ty = ny + 0.5;
      f.walking = true;
    } else {
      f.wait = 2;
    }
  }
}

function drawFarmer(ctx, cam, cw, ch, f) {
  const p = projectPoint(f.gx, f.gy, 0);
  const s = worldToScreen(cam, p.x, p.y, cw, ch);
  const z = cam.zoom;
  const bob = f.walking ? Math.abs(Math.sin(f.phase * 8)) * 2.5 * z : Math.sin(f.phase * 2) * 0.6 * z;
  const legSwing = f.walking ? Math.sin(f.phase * 8) * 3 : 0;
  const armSwing = f.walking ? Math.sin(f.phase * 8 + Math.PI) * 2 : 0;
  const face = f.face || 0;
  const fx = Math.cos(face);
  const flip = Math.abs(fx) < 0.15 ? (f.lastDir || 1) : (fx >= 0 ? 1 : -1);
  const squash = Math.max(0.5, Math.abs(fx));

  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.scale(z * flip * squash, z);

  ctx.fillStyle = 'rgba(20,40,10,' + (0.2 * (0.35 + 0.65 * dayLight())).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(0, 1, f.riding ? 17 : 8, f.riding ? 7 : 3.5, 0, 0, Math.PI * 2);
  ctx.fill();

  if (f.riding) {
    drawHorseBody(ctx, bob, 1, f.walking, f.phase);
    ctx.translate(0, -13);
  }

  ctx.strokeStyle = '#5d4037';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(-2.5, -8); ctx.lineTo(-2.5 + legSwing, 0);
  ctx.moveTo(2.5, -8); ctx.lineTo(2.5 - legSwing, 0);
  ctx.stroke();

  ctx.fillStyle = '#4e342e';
  ctx.beginPath();
  ctx.ellipse(-2.5 + legSwing, 0.5, 2.2, 1.1, 0, 0, Math.PI * 2);
  ctx.ellipse(2.5 - legSwing, 0.5, 2.2, 1.1, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = f.shirt || '#c62828';
  ctx.beginPath();
  ctx.rect(-5, -18 + bob * 0.4, 10, 11);
  ctx.fill();

  ctx.fillStyle = f.shirtDark || '#8e0000';
  ctx.fillRect(-5, -12 + bob * 0.4, 10, 2);

  ctx.strokeStyle = f.shirtDark || '#8e0000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-5, -16 + bob * 0.4); ctx.lineTo(-8, -11 + armSwing + bob * 0.4);
  ctx.moveTo(5, -16 + bob * 0.4); ctx.lineTo(8, -11 - armSwing + bob * 0.4);
  ctx.stroke();
  ctx.strokeStyle = '#ffcc80';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-8, -12 + armSwing + bob * 0.4); ctx.lineTo(-8.5, -10 + armSwing + bob * 0.4);
  ctx.moveTo(8, -12 - armSwing + bob * 0.4); ctx.lineTo(8.5, -10 - armSwing + bob * 0.4);
  ctx.stroke();

  ctx.fillStyle = '#ffcc80';
  ctx.beginPath();
  ctx.arc(0, -22 + bob * 0.4, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#5d4037';
  ctx.beginPath();
  ctx.arc(1.5 - 1.2, -23.5 + bob * 0.4, 0.8, 0, Math.PI * 2);
  ctx.arc(1.5 + 1.2, -23.5 + bob * 0.4, 0.8, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#a1887f';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.arc(2, -21.6 + bob * 0.4, 1.6, 0.25, Math.PI - 0.25);
  ctx.stroke();

  ctx.fillStyle = '#e6c465';
  ctx.beginPath();
  ctx.ellipse(0, -24.5 + bob * 0.4, 7, 2.4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#d4af37';
  ctx.beginPath();
  ctx.ellipse(0, -25.8 + bob * 0.4, 4, 2, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

let LANG = 'pt-BR';

function t(key, params) {

  if (params) for (const k in params) s = s.replaceAll('{' + k + '}', params[k]);

}

/* ---------- Sons (WebAudio, sem arquivos externos) ---------- */
let audioCtx = null;

function getAudioCtx() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSound(kind) {
  if (!game.settings.sound) return;
  try {
    const ac = getAudioCtx();
    const notes = {
      click: [660, 0.05], place: [520, 0.12], remove: [220, 0.15],
      rotate: [440, 0.08], level: [784, 0.2], error: [180, 0.18],
      plant: [392, 0.1], water: [330, 0.12], harvest: [880, 0.16], dig: [180, 0.14]
    };
    const [freq, dur] = notes[kind] || notes.click;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + dur);
  } catch (e) { /* áudio indisponível */ }
}

/* ---------- Música ambiente (gerada, sem arquivos) ---------- */
const MELODY = [523.25, 659.25, 783.99, 659.25, 587.33, 783.99, 880, 783.99,
                659.25, 523.25, 587.33, 659.25, 523.25, 392, 440, 523.25];
const BASS = [130.81, 130.81, 174.61, 174.61, 196, 196, 130.81, 130.81];
let musicTimer = null;
let musicStep = 0;

function musicNote(freq, dur, vol, type) {
  const ac = getAudioCtx();
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ac.currentTime);
  gain.gain.linearRampToValueAtTime(vol, ac.currentTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(); osc.stop(ac.currentTime + dur);
}

function startMusic() {
  if (musicTimer) return;
  try {
    getAudioCtx();
    musicTimer = setInterval(() => {
      if (!game.settings.music) { stopMusic(); return; }
      musicNote(MELODY[musicStep % MELODY.length], 0.9, 0.045, 'triangle');
      if (musicStep % 2 === 0) {
        musicNote(BASS[(musicStep / 2) % BASS.length], 1.8, 0.03, 'sine');
      }
      musicStep++;
    }, 450);
  } catch (e) { /* áudio indisponível */ }
}

function stopMusic() {
  clearInterval(musicTimer);
  musicTimer = null;
}

/* ---------- Toast ---------- */
let toastTimer = null;
function showToast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => el.classList.add('hidden'), 300);
  }, 2200);
}

/* ---------- HUD ---------- */
let lastDayPhase = null;
let lastClockStr = '';
let lastCalStr = '';
const PHASE_ICONS = { dawn: '🌅', day: '☀', afternoon: '🌤', night: '🌙' };

function refreshHud() {
  const phase = dayPhase();
  const clock = clockString(game.time);
  const gd = gameDate();
  const calStr = SEASON_ICONS[seasonName()] + ' ' + gd.day + ' de ' + gd.name;
  if (phase !== lastDayPhase || clock !== lastClockStr || calStr !== lastCalStr) {
    lastDayPhase = phase;
    lastClockStr = clock;
    lastCalStr = calStr;
    const chip = $('day-chip');
    if (chip) chip.textContent = PHASE_ICONS[phase] + ' ' + clock + '   ' + calStr;
  }
  const dogBtn = $('btn-dog');
  if (dogBtn) {
    dogBtn.classList.toggle('hidden', !game.dogs.length);
    dogBtn.classList.toggle('active', game.dogs.some(d => d.active));
  }
  const tractorBtn = $('btn-tractor');
  if (tractorBtn) tractorBtn.classList.toggle('hidden', !game.tractorOwned);
  const ownedTill = upgradeLevel('till') > 0;
  const ownedWater = upgradeLevel('water') > 0;
  const gateBtns = [
    ['btn-till', ownedTill],
    ['btn-plant', ownedTill],
    ['btn-water', ownedWater],
    ['btn-harvestall', game.crops.length > 0],
    ['btn-collectall', game.animals.length > 0],
    ['btn-pen', game.animals.length > 0]
  ];
  for (const gb of gateBtns) {
    const gbEl = $(gb[0]);
    if (gbEl) gbEl.classList.toggle('hidden', !gb[1]);
  }
  if (uiDirty.coins) { $('coins-value').textContent = game.coins.toLocaleString('pt-BR'); uiDirty.coins = false; }
  if (uiDirty.gems) { $('gems-value').textContent = game.gems; uiDirty.gems = false; }
  if (uiDirty.xp) {
    $('level-text').textContent = (game.playerFace || '') + ' ' + t('hud.level', { n: game.level });
    $('farm-name').textContent = game.farmName;
    const need = xpForLevel(game.level);
    $('xp-fill').style.width = Math.min(100, (game.xp / need) * 100) + '%';
    uiDirty.xp = false;
  }
}

        `;
        const buyBtn = document.createElement('button');
        buyBtn.className = 'shop-buy-btn';
        buyBtn.textContent = locked ? t('shop.locked', { n: def.level }) : (!afford ? t('shop.noCoins') : (full ? t('toast.animalLimit') : t('shop.buyAnimal')));
        buyBtn.disabled = locked || !afford || full;
        buyBtn.onclick = () => {
          if (buyAnimal(def.id)) {
            showToast(t('toast.animalBought', { icon: def.icon, name: t('an_' + def.id) }));
            refreshHud();
            openShop();
          }
        };
        item.appendChild(buyBtn);
        grid.appendChild(item);
      }
      body.appendChild(grid);
      return;
    }
    if (currentShopTab === 'upgrades') {
      for (const def of UPGRADES) {
        const lvl = upgradeLevel(def.id);
        const maxed = lvl >= def.max;
        const noTool = lvl === 0;
        const price = maxed || noTool ? 0 : def.prices[lvl];
        const name = def.names[Math.min(lvl, def.names.length - 1)];
        const item = document.createElement('div');

        item.innerHTML = `

          <div class="shop-item-name">${name}</div>
          <div class="shop-item-desc" style="font-size:11px;color:#6d4c41;text-align:center">${maxed ? '' : (noTool ? t('upg.baseHint') : t('upg.next', { name: def.names[lvl] }))}</div>
          <div class="shop-item-price">${maxed ? '⭐' : (noTool ? '—' : '🪙 ' + price.toLocaleString('pt-BR'))}</div>
        `;
        const btn = document.createElement('button');
        btn.className = 'shop-buy-btn';
        btn.disabled = maxed || noTool || game.coins < price;
        btn.textContent = maxed ? t('shop.maxed') : (noTool ? t('upg.baseFirst') : t('shop.buyUpgrade'));
        btn.onclick = () => {
          if (buyUpgrade(def.id)) { showToast(t('toast.upgraded')); refreshHud(); openShop(); }
        };
        item.appendChild(btn);
        grid.appendChild(item);
      }
      body.appendChild(grid);
      return;
    }
    if (currentShopTab === 'ferramentas') {
      const unlockedCrops = Object.values(CROPS).filter(c => c.level <= game.level).length;
      const seedsPrice = 12 * unlockedCrops;
      for (const def of TOOLS) {
        const locked = game.level < def.level;
        const owned = def.id !== 'seeds' && toolOwned(def.id);
        const price = def.id === 'seeds' ? seedsPrice : def.price;
        const afford = game.coins >= price;
        const item = document.createElement('div');
        item.className = 'shop-item';
        item.innerHTML = `
          <div class="shop-item-icon">${def.icon}</div>
          <div class="shop-item-name">${t('tool.' + def.id)}</div>
          <div class="shop-item-desc" style="font-size:11px;color:#6d4c41;text-align:center">${t('tool.' + def.id + '_desc')}</div>
          <div class="shop-item-price">🪙 ${price.toLocaleString('pt-BR')}</div>
          ${locked ? `<div class="shop-item-locked">${t('shop.locked', { n: def.level })}</div>` : ''}
        `;
        const btn = document.createElement('button');
        btn.className = 'shop-buy-btn';
        btn.disabled = locked || !afford || owned;
        btn.textContent = locked ? t('shop.locked', { n: def.level }) : (owned ? t('toast.toolOwned') : (!afford ? t('shop.noCoins') : t('shop.buyUpgrade')));
        btn.onclick = () => {
          if (buyTool(def.id)) {
            showToast(def.id === 'seeds'
              ? t('toast.seedsBought', { icon: def.icon })
              : t('toast.toolBought', { icon: def.icon, name: t('tool.' + def.id) }));
            refreshHud();
            openShop();
          }
        };
        item.appendChild(btn);
        grid.appendChild(item);
      }
      body.appendChild(grid);
      return;
    }
    if (currentShopTab === 'ajudantes') {
      for (const def of Object.values(HELPERS)) {
        const locked = game.level < def.level;
        const price = def.id === 'farmer' ? farmerPrice() : (def.id === 'dog' ? dogPrice() : def.price);
        const owned = def.id === 'dog' && game.dogs.length >= MAX_DOGS;
        const afford = game.coins >= price;
        const item = document.createElement('div');
        item.className = 'shop-item';
        item.innerHTML = `
          <div class="shop-item-icon">${def.icon}</div>
          <div class="shop-item-name">${t('h_' + def.id)}</div>
          <div class="shop-item-desc" style="font-size:11px;color:#6d4c41;text-align:center">${t('h_' + def.id + '_desc')}</div>
          <div class="shop-item-price">🪙 ${price.toLocaleString('pt-BR')}</div>
          ${locked ? `<div class="shop-item-locked">${t('shop.locked', { n: def.level })}</div>` : ''}
        `;
        const buyBtn = document.createElement('button');
        buyBtn.className = 'shop-buy-btn';
        const buyLabel = def.id === 'farmer' ? t('shop.hire') : t('shop.buyAnimal');
        buyBtn.textContent = locked ? t('shop.locked', { n: def.level }) : (owned ? t('shop.dogOwned') : (!afford ? t('shop.noCoins') : buyLabel));
        buyBtn.disabled = locked || !afford || owned;
        buyBtn.onclick = () => {
          const ok = def.id === 'farmer' ? buyFarmer() : buyDog();
          if (ok) {
            showToast(def.id === 'farmer' ? t('toast.farmerBought') : t('toast.dogBought'));
            refreshHud();
            openShop();
          }
        };
        item.appendChild(buyBtn);
        grid.appendChild(item);
      }
      body.appendChild(grid);
      return;
    }
    for (const def of Object.values(BUILDINGS)) {
      if (def.category !== currentShopTab) continue;
      const locked = game.level < def.level;
      const afford = game.coins >= def.price;
      const item = document.createElement('div');
      item.className = 'shop-item';
      item.innerHTML = `
        <div class="shop-item-icon">${def.icon}</div>
        <div class="shop-item-name">${t('b_' + def.id)}</div>
        <div class="shop-item-size">${def.w}×${def.d} tiles</div>
        <div class="shop-item-desc" style="font-size:11px;color:#6d4c41;text-align:center">${t('b_' + def.id + '_desc')}</div>

        ${locked ? `<div class="shop-item-locked">${t('shop.locked', { n: def.level })}</div>` : ''}
      `;
      const buyBtn = document.createElement('button');
      buyBtn.className = 'shop-buy-btn';
      buyBtn.textContent = locked ? t('shop.locked', { n: def.level }) : (!afford ? t('shop.noCoins') : t('shop.select'));
      buyBtn.disabled = locked || !afford;
      buyBtn.onclick = () => {
        closeModal();
        enterBuildMode(def.id);
      };
      item.appendChild(buyBtn);
      grid.appendChild(item);
    }
    body.appendChild(grid);
  });
}

/* ---------- Configurações ---------- */
const PLAYER_FACES = ['👨‍🌾', '👩‍🌾', '🧑‍🌾', '👴', '👵', '🧔', '👨‍🦰', '👩‍🦰'];

function openSettings() {
  openModal(t('modal.settings'), body => {
    const rows = [
      { label: t('settings.sound'), key: 'sound', type: 'toggle' },
      { label: t('settings.music'), key: 'music', type: 'toggle' },
      { label: t('settings.quality'), key: 'quality', type: 'select',
        options: ['baixa', 'média', 'alta'], translate: true },
      { label: t('settings.language'), key: 'language', type: 'select',
        options: ['pt-BR', 'en-US'], translate: false }
    ];
    for (const r of rows) {
      const row = document.createElement('div');
      row.className = 'settings-row';
      row.innerHTML = `<span>${r.label}</span>`;
      let input;
      if (r.type === 'toggle') {
        input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = game.settings[r.key];
        input.onchange = () => {
          game.settings[r.key] = input.checked;
          playSound('click');
          if (r.key === 'music') {
            if (input.checked) startMusic(); else stopMusic();
          }
          saveGame(false);
        };
      } else {
        input = document.createElement('select');
        for (const opt of r.options) {
          const o = document.createElement('option');
          o.value = opt;
          o.textContent = r.translate ? t('q.' + opt) : opt;
          if (game.settings[r.key] === opt) o.selected = true;
          input.appendChild(o);
        }
        input.onchange = () => {
          game.settings[r.key] = input.value;
          playSound('click');
          if (r.key === 'language') applyLang();
          saveGame(false);
        };
      }
      row.appendChild(input);
      body.appendChild(row);
    }

    const nameRow = document.createElement('div');
    nameRow.className = 'settings-row';
    nameRow.innerHTML = `<span>${t('profile.name')}</span>`;
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.maxLength = 16;
    nameInput.value = game.playerName || 'Fazendeiro';
    nameInput.onchange = () => {
      game.playerName = nameInput.value.trim() || 'Fazendeiro';
      saveGame(false);
      refreshHud();
    };
    nameRow.appendChild(nameInput);
    body.appendChild(nameRow);

    const faceRow = document.createElement('div');
    faceRow.className = 'settings-row';
    faceRow.innerHTML = `<span>${t('profile.face')}</span>`;
    const facePick = document.createElement('div');
    facePick.style.cssText = 'display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:160px';
    for (const face of PLAYER_FACES) {
      const fb = document.createElement('button');
      fb.className = 'face-btn' + (game.playerFace === face ? ' active' : '');
      fb.textContent = face;
      fb.onclick = () => {
        game.playerFace = face;
        saveGame(false);
        openSettings();
      };
      facePick.appendChild(fb);
    }
    faceRow.appendChild(facePick);
    body.appendChild(faceRow);

    const saveBtn = document.createElement('button');
    saveBtn.className = 'settings-btn';
    saveBtn.style.background = 'var(--blue)';
    saveBtn.style.color = '#fff';
    saveBtn.textContent = t('settings.saveNow');
    saveBtn.onclick = () => { saveGame(true); refreshHud(); };

    const resetBtn = document.createElement('button');
    resetBtn.className = 'settings-btn';
    resetBtn.style.background = 'var(--red)';
    resetBtn.style.color = '#fff';
    resetBtn.textContent = t('settings.reset');
    resetBtn.onclick = () => {
      confirmDialog(t('settings.resetConfirm'), () => resetGame());
    };

    body.appendChild(saveBtn);
    body.appendChild(resetBtn);
  });
}

function updateVisitBanner() {

function openMultiplayer() {
  openModal(t('mp.title'), body => {
    if (game.visiting) {
      const leave = document.createElement('button');
      leave.className = 'mp-big-btn mp-danger';
      leave.textContent = t('mp.leave');
      leave.onclick = () => { closeModal(); leaveVisitMode(); };
      body.appendChild(leave);
      const gt = document.createElement('div');
      gt.className = 'mp-label';
      gt.textContent = t('mp.gift');
      body.appendChild(gt);
      buildGiftUi(body);
      return;
    }

    const visitLbl = document.createElement('div');
    visitLbl.className = 'mp-label';
    visitLbl.textContent = t('mp.visitTitle');
    body.appendChild(visitLbl);

    const visitRow = document.createElement('div');
    visitRow.className = 'mp-visit-row';
    const input = document.createElement('input');
    input.className = 'mp-input';
    input.placeholder = '482913';
    input.maxLength = 6;
    input.autocomplete = 'off';
    input.inputMode = 'numeric';
    input.addEventListener('input', () => {
      input.value = input.value.replace(/[^0-9]/g, '').slice(0, 6);
    });
    const go = document.createElement('button');
    go.className = 'mp-big-btn mp-go';
    go.textContent = t('mp.visitBtn');
    const tryVisit = () => {
      const code2 = input.value.replace(/[^0-9]/g, '');
      if (!/^[0-9]{6}$/.test(code2)) { showToast(t('toast.mpBadCode')); return; }
      go.disabled = true;
      visitFarm(code2, err => {
        go.disabled = false;
        if (err) { showToast(t('toast.mpError', { err: err.message || err.type || 'erro' })); return; }
        closeModal();
      });
    };
    go.onclick = tryVisit;
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); tryVisit(); }
      ev.stopPropagation();
    });
    visitRow.appendChild(input);
    visitRow.appendChild(go);
    body.appendChild(visitRow);

    const hint = document.createElement('div');
    hint.className = 'mp-status';
    hint.textContent = t('mp.hint2');
    body.appendChild(hint);

    const hr = document.createElement('hr');
    hr.className = 'mp-hr';
    body.appendChild(hr);

    const codeLbl = document.createElement('div');
    codeLbl.className = 'mp-label';
    codeLbl.textContent = t('mp.myCode');
    body.appendChild(codeLbl);

    const code = ensureFarmCode();
    const codeBtn = document.createElement('button');
    codeBtn.className = 'mp-code';
    codeBtn.innerHTML = '📋 ' + code + ' <small>' + t('mp.myCodeHint') + '</small>';
    codeBtn.onclick = () => {
      if (navigator.clipboard) navigator.clipboard.writeText(code);
      showToast(t('toast.mpCodeCopied'));
    };
    body.appendChild(codeBtn);

    const linkBtn = document.createElement('button');
    linkBtn.className = 'mp-big-btn';
    linkBtn.textContent = t('barn.share');
    linkBtn.onclick = () => {
      const url = location.origin + location.pathname + '?farm=' + code;
      if (navigator.clipboard) navigator.clipboard.writeText(url);
      showToast(t('toast.linkCopied'));
    };
    body.appendChild(linkBtn);

    const hostBtn = document.createElement('button');
    hostBtn.className = 'mp-big-btn';
    hostBtn.textContent = mpStatus === 'hosting' ? t('mp.stop') : t('mp.host');
    hostBtn.onclick = () => {
      if (mpStatus === 'hosting') { stopHosting(); openMultiplayer(); return; }
      hostBtn.disabled = true;
      hostFarm(err => {
        hostBtn.disabled = false;
        if (err) { showToast(t('toast.mpError', { err: err.message || err.type || 'erro' })); return; }
        openMultiplayer();
      });
    };
    body.appendChild(hostBtn);
    if (mpStatus === 'hosting') {
      const st = document.createElement('div');
      st.className = 'mp-status';
      st.textContent = t('mp.hosting');
      body.appendChild(st);
    }
  });
}

function buildGiftUi(body) {
  const chatLbl = document.createElement('div');
  chatLbl.className = 'mp-label';
  chatLbl.textContent = t('mp.chat');
  body.appendChild(chatLbl);
  const chatRow = document.createElement('div');
  chatRow.className = 'farmer-roles';
  const phrases = t('chat.list') || [];
  for (let i = 0; i < phrases.length && i < 4; i++) {
    const b = document.createElement('button');
    b.className = 'farmer-role-btn';
    b.textContent = phrases[i];
    b.onclick = () => { if (sendChat(i)) showToast(t('toast.chatSent')); };
    chatRow.appendChild(b);
  }
  body.appendChild(chatRow);

  const kindRow = document.createElement('div');
  kindRow.className = 'farmer-roles';
  let kind = 'coins';
  for (const k of ['coins', 'seed', 'animal']) {
    const b = document.createElement('button');
    b.className = 'farmer-role-btn' + (k === kind ? ' active' : '');
    b.textContent = t('mp.gift' + (k === 'coins' ? 'Coins' : k === 'seed' ? 'Seeds' : 'Animal'));
    b.onclick = () => { kind = k; buildGiftUiRefresh(body); };
    kindRow.appendChild(b);
  }
  body.appendChild(kindRow);
  buildGiftPicker(body, kind);
}

function buildGiftUiRefresh(body) {
  while (body.lastChild) body.removeChild(body.lastChild);
  buildGiftUi(body);
}

function buildGiftPicker(body, kind) {
  const qtyLbl = document.createElement('div');
  qtyLbl.className = 'mp-label';
  qtyLbl.textContent = t('mp.qty');
  body.appendChild(qtyLbl);
  const qty = document.createElement('input');
  qty.className = 'mp-input';
  qty.type = 'number';
  qty.min = '1';
  qty.value = kind === 'coins' ? '100' : '1';
  body.appendChild(qty);
  let itemId = null;
  if (kind !== 'coins') {
    const sel = document.createElement('select');
    sel.className = 'mp-input';
    const src = kind === 'seed' ? CROPS : ANIMALS;
    for (const id of Object.keys(src)) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = (src[id].icon || '') + ' ' + t((kind === 'seed' ? 'c_' : 'an_') + id);
      sel.appendChild(opt);
    }
    itemId = sel.value;
    sel.onchange = () => { itemId = sel.value; };
    body.appendChild(sel);
  }
  const send = document.createElement('button');
  send.className = 'mp-big-btn';
  send.textContent = t('mp.giftSend');
  send.onclick = () => {
    const gift = { kind, id: itemId, n: Math.max(1, Math.floor(Number(qty.value) || 1)) };
    if (!sendGift(gift)) { showToast(t('toast.giftFailed')); return; }
    closeModal();
  };
  body.appendChild(send);
}

function setupWheel(el) {
  if (!el || !el.addEventListener) return;
  let lastTop = 0;
  el.addEventListener('scroll', () => {
    const max = el.scrollHeight - el.clientHeight;
    if (max <= 8) return;
    const down = el.scrollTop > lastTop;
    if (down && el.scrollTop >= max - 2) el.scrollTop = 0;
    else if (!down && el.scrollTop <= 2) el.scrollTop = max;
    lastTop = el.scrollTop;
  }, { passive: true });
}

function bindUi(handlers) {
  $('btn-settings').onclick = openSettings;
  $('btn-add-coins').onclick = openCoinShop;
  $('btn-add-gems').onclick = openGemShop;
  $('btn-build').onclick = () => handlers.build();
  $('btn-shovel').onclick = () => handlers.shovel();
  $('btn-till').onclick = () => handlers.till();
  $('btn-plant').onclick = () => handlers.plant();
  $('btn-water').onclick = () => handlers.water();
  $('btn-harvestall').onclick = () => handlers.harvestAll();
  $('btn-collectall').onclick = () => handlers.collectAll();
  $('btn-pen').onclick = () => handlers.pen();
  $('btn-dog').onclick = () => handlers.dog();
  $('btn-tractor').onclick = () => { if (!game.visiting) startTractor(); };
  $('btn-move').onclick = () => handlers.move();
  $('btn-remove').onclick = () => handlers.remove();
  $('btn-rotate').onclick = () => handlers.rotate();
  $('btn-zoom-in').onclick = () => zoomHandlers.zoomIn();
  $('btn-zoom-out').onclick = () => zoomHandlers.zoomOut();
  $('btn-zoom-reset').onclick = () => zoomHandlers.zoomReset();
  $('btn-buy').onclick = openBuyMenu;
  $('btn-leave-visit').onclick = () => { if (mpStatus === 'visiting') leaveVisitMode(); };

  $('btn-collapse-left').onclick = () => {
    document.body.classList.toggle('tools-left-hidden');
    playSound('click');
  };
  $('btn-collapse-right').onclick = () => {
    document.body.classList.toggle('tools-right-hidden');
    playSound('click');
  };

  for (const btn of document.querySelectorAll('.side-btn')) {
    btn.onclick = () => {
      const panel = btn.dataset.panel;
      if (panel === 'missions') openMissions();
      else if (panel === 'shop') openShop();
      else if (panel === 'achievements') openAchievements();
      else if (panel === 'farmers') openFarmersPanel();
      else if (panel === 'barn') openBarn();
      else if (panel === 'multiplayer') openMultiplayer();
    };
  }

  setupWheel($('build-bar'));
  setupWheel($('side-menu'));

  const dchip = $('day-chip');
  if (dchip) dchip.onclick = () => openCalendar();

  $('modal-close').onclick = closeModal;
  $('modal-overlay').onclick = e => { if (e.target === $('modal-overlay')) closeModal(); };

  $('dialog-ok').onclick = () => {
    $('dialog-overlay').classList.add('hidden');
    if (dialogCallback) dialogCallback();
    dialogCallback = null;
  };
  $('dialog-cancel').onclick = () => { $('dialog-overlay').classList.add('hidden'); dialogCallback = null; };

  $('confirm-ok').onclick = () => handlers.confirmOk();
  $('confirm-cancel').onclick = () => handlers.confirmCancel();

  // música só pode iniciar após um gesto do usuário (política de autoplay)
  document.addEventListener('pointerdown', () => {
    if (game.settings.music) startMusic();
  }, { once: true });
}

<script>
/* ============================================================
   MULTIPLAYER P2P (PeerJS) — salas por codigo de fazenda
   O dono abre a sala (peer id = codigo); visitantes conectam,
   recebem o estado da fazenda (somente leitura) e podem
   presentear com moedas, sementes e animais.
   ============================================================ */

const MP_PREFIX = 'fazenda3d-v1-';
const MP_SYNC_INTERVAL = 10;
const MP_GIFT_LIMITS = { coins: 10000, seeds: 20, animals: 2 };

let mpPeer = null;
let mpConns = [];
let mpVisitConn = null;
let mpSyncT = 0;
let mpStatus = 'off'; /* off | connecting | hosting | visiting */

function mpPeerId(code) {
  return MP_PREFIX + String(code || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
}

function loadPeerJs(cb) {
  if (typeof Peer !== 'undefined') { cb(null); return; }
  const s = document.createElement('script');
  s.src = ['https:', '', 'unpkg.com', 'peerjs@1.5.4', 'dist', 'peerjs.min.js'].join('/');
  s.onload = () => cb(null);
  s.onerror = () => cb(new Error('cdn'));
  document.head.appendChild(s);
}

function mpSnapshot() {
  return snapshotData();
}

function mpClosePeer() {
  for (const c of mpConns) { try { c.close(); } catch (e) {} }
  mpConns = [];
  if (mpVisitConn) { try { mpVisitConn.close(); } catch (e) {} mpVisitConn = null; }
  if (mpPeer) { try { mpPeer.destroy(); } catch (e) {} mpPeer = null; }
  mpStatus = 'off';
}

function stopHosting() {
  mpClosePeer();
}

function hostFarm(onReady) {
  if (mpStatus === 'hosting') { onReady(null); return; }
  loadPeerJs(err => {
    if (err) { onReady(err); return; }
    mpClosePeer();
    const code = ensureFarmCode();
    mpPeer = new Peer(mpPeerId(code));
    mpStatus = 'connecting';
    mpPeer.on('open', () => { mpStatus = 'hosting'; onReady(null); });
    mpPeer.on('connection', conn => {
      mpConns.push(conn);
      conn.on('open', () => { try { conn.send({ type: 'state', data: mpSnapshot() }); } catch (e) {} });
      conn.on('data', msg => {
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'hello') {
          try { conn.send({ type: 'state', data: mpSnapshot() }); } catch (e) {}
        } else if (msg.type === 'chat') {
          const phrases = t('chat.list');
          const txt = phrases[msg.idx % phrases.length];
          if (txt) {
            showToast(t('toast.visitorSaid', { msg: txt }));
            const f = game.farmers[Math.floor(Math.random() * Math.max(1, game.farmers.length))];
            if (f && farmerSay) farmerSay(f, phrases[(msg.idx + 1 + Math.floor(Math.random() * 3)) % phrases.length], 6000);
          }
        } else if (msg.type === 'gift') {
          const res = receiveGift(msg.gift);
          try { conn.send({ type: 'gift-ack', ok: !!res, msg: res ? res.msg : null }); } catch (e) {}
          if (res) showToast(t('toast.giftReceived', { msg: res.msg }));
        }
      });
      const drop = () => { mpConns = mpConns.filter(c => c !== conn); };
      conn.on('close', drop);
      conn.on('error', drop);
    });
    mpPeer.on('error', e => {
      if (mpStatus === 'connecting') { mpStatus = 'off'; onReady(e); }
    });
  });
}

function visitFarm(code, onReady) {
  loadPeerJs(err => {
    if (err) { onReady(err); return; }
    mpClosePeer();
    mpPeer = new Peer();
    mpStatus = 'connecting';
    mpPeer.on('open', () => {
      const conn = mpPeer.connect(mpPeerId(code), { reliable: true });
      mpVisitConn = conn;
      const timer = setTimeout(() => {
        if (mpStatus === 'connecting') { mpStatus = 'off'; onReady(new Error('timeout')); }
      }, 12000);
      conn.on('open', () => {
        clearTimeout(timer);
        try { conn.send({ type: 'hello' }); } catch (e) {}
      });
      conn.on('data', msg => {
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'state') {
          const first = mpStatus !== 'visiting';
          clearTimeout(timer);
          if (first) {
            enterVisitMode(msg.data);
            onReady(null);
          } else {
            applySaveData(msg.data);
          }
        } else if (msg.type === 'gift-ack') {
          showToast(msg.ok ? (t('toast.giftSent') + (msg.msg ? ': ' + msg.msg : '')) : t('toast.giftFailed'));
        }
      });
      conn.on('close', () => { if (mpStatus === 'visiting') leaveVisitLost(); });
      conn.on('error', () => { if (mpStatus === 'visiting') leaveVisitLost(); });
    });
    mpPeer.on('error', e => {
      if (mpStatus === 'connecting') { mpStatus = 'off'; onReady(e); }
      else if (mpStatus === 'visiting') leaveVisitLost();
    });
  });
}

function leaveVisitLost() {
  if (mpStatus !== 'visiting') return;
  leaveVisitMode(true);
  showToast(t('toast.mpLost'));
}

function enterVisitMode(data) {
  saveGame(false);
  try { localStorage.setItem(SAVE_KEY + '_visit', JSON.stringify(snapshotData())); } catch (e) {}
  applySaveData(data);
  game.visiting = true;
  mpStatus = 'visiting';
  if (typeof setMode === 'function') setMode('idle');
  state.ghost = null;
  state.highlightTile = null;
  updateVisitBanner();
  showToast(t('toast.visiting'));
}

function leaveVisitMode(silent) {
  if (mpVisitConn) { try { mpVisitConn.close(); } catch (e) {} mpVisitConn = null; }
  game.visiting = false;
  mpStatus = 'off';
  let restored = false;
  try {
    const raw = localStorage.getItem(SAVE_KEY + '_visit');
    if (raw) {
      restored = applySaveData(JSON.parse(raw));
      localStorage.removeItem(SAVE_KEY + '_visit');
    }
  } catch (e) {}
  if (!restored) loadGame();
  updateVisitBanner();
  if (!silent) showToast(t('toast.backHome'));
}

function sendGift(gift) {
  if (mpStatus !== 'visiting' || !mpVisitConn) return false;
  try { mpVisitConn.send({ type: 'gift', gift }); return true; } catch (e) { return false; }
}

function sendChat(idx) {
  if (mpStatus !== 'visiting' || !mpVisitConn) return false;
  try { mpVisitConn.send({ type: 'chat', idx }); return true; } catch (e) { return false; }
}

function updateMultiplayer(dt) {
  if (mpStatus !== 'hosting') return;
  mpSyncT -= dt;
  if (mpSyncT <= 0) {
    mpSyncT = MP_SYNC_INTERVAL;
    const snap = mpSnapshot();
    for (const c of mpConns) {
      try { if (c.open) c.send({ type: 'state', data: snap }); } catch (e) {}
    }
  }
}
