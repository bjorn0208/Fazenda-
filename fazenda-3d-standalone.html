<script>
/* ================= FAZENDA 3D — FAZENDEIRO AUTOMÁTICO =================
   NPC contratável: caminha pela fazenda, planta as sementes do baú,
   rega, colhe o que ficar pronto e vende na hora pelos você. */

const FARMER_SPEED = 1.1;

function farmerWalkable(x, y) {
  return inBounds(x, y) && inOwnedArea(x, y) && !occupancy[occIndex(x, y)];
}

/* Agenda pelo ciclo do dia: de dia arar/plantar/regar; a tarde colher; noite descansam. */
function farmerFindTillSpot(f) {
  const candidates = new Set();
  for (const c of game.crops) {
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const x = c.gx + dx, y = c.gy + dy;
      if (inBounds(x, y) && inOwnedArea(x, y) && !occupancy[occIndex(x, y)] && !isTilled(x, y)) {
        candidates.add(x + ',' + y);
      }
    }
  }
  let best = null, bestD = Infinity;
  for (const key of candidates) {
    const [x, y] = key.split(',').map(Number);
    const d = Math.hypot(x + 0.5 - f.gx, y + 0.5 - f.gy);
    if (d < bestD) { bestD = d; best = { x, y }; }
  }
  return best;
}

function farmerFindWaterTarget(f) {
  let best = null, bestD = Infinity;
  for (const c of game.crops) {
    if (c.watered || cropProgress(c) >= 1) continue;
    const d = Math.hypot(c.gx + 0.5 - f.gx, c.gy + 0.5 - f.gy);
    if (d < bestD) { bestD = d; best = c; }
  }
  return best;
}

function hasHorse() {
  return game.animals.some(a => a.kind === 'horse');
}

/* Escolhe o proximo trabalho respeitando a fase do dia e a funcao do fazendeiro. */
function farmerFindJob(f) {
  const role = f.role || 'all';
  const phase = dayPhase();
  if (phase === 'night') return null;
  if (role !== 'animal') {
    if (phase === 'day') {
      for (const type of Object.keys(f.chest)) {
        if (f.chest[type] > 0) return { kind: 'plant', type };
      }
      const till = farmerFindTillSpot(f);
      if (till) return { kind: 'till', target: till };
      const dry = farmerFindWaterTarget(f);
      if (dry) return { kind: 'water', target: dry };
    }
    if (phase === 'afternoon') {
      let best = null, bestD = Infinity;
      for (const c of game.crops) {
        if (cropProgress(c) < 1) continue;
        const d = Math.hypot(c.gx + 0.5 - f.gx, c.gy + 0.5 - f.gy);
        if (d < bestD) { bestD = d; best = c; }
      }
      if (best) return { kind: 'harvest', target: best };
    }
  }
  if (role !== 'plant') {
    let an = null;
    let bestD = Infinity;
    for (const a of game.animals) {
      const ready = pigReady(a) || a.product > 0;
      if (!ready) continue;
      const d = Math.hypot(a.gx - f.gx, a.gy - f.gy);
      if (d < bestD) { bestD = d; an = a; }
    }
    if (an) return { kind: 'animal', target: an };
  }
  return null;
}

function farmerFindPlantSpot(f, type) {
  const a = game.ownedArea;
  const candidates = new Set();
  for (const c of game.crops) {
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const x = c.gx + dx, y = c.gy + dy;
      if (inBounds(x, y) && inOwnedArea(x, y) && !occupancy[occIndex(x, y)]) {
        candidates.add(x + ',' + y);
      }
    }
  }
  let best = null, bestScore = -Infinity;
  for (const key of candidates) {
    const [x, y] = key.split(',').map(Number);
    const d = Math.hypot(x + 0.5 - f.gx, y + 0.5 - f.gy);
    let score = -d;
    if (isTilled(x, y)) score += 50;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nb = occupancy[occIndex(x + dx, y + dy)];
      if (nb && nb.isCrop) score += (nb.type === type ? 20 : 5);
    }
    if (score > bestScore) { bestScore = score; best = { x, y }; }
  }
  if (best) return best;
  for (let tries = 0; tries < 40; tries++) {
    const x = a.x0 + Math.floor(Math.random() * (a.x1 - a.x0 + 1));
    const y = a.y0 + Math.floor(Math.random() * (a.y1 - a.y0 + 1));
    if (!occupancy[occIndex(x, y)]) return { x, y };
  }
  return null;
}

function houseDoorTile() {
  const b = game.buildings.find(x => x.type === 'house');
  if (!b) return null;
  const cands = [[b.gx + 1, b.gy + 3], [b.gx, b.gy + 3], [b.gx + 2, b.gy + 3], [b.gx + 3, b.gy + 1], [b.gx - 1, b.gy + 1]];
  for (const [x, y] of cands) {
    if (farmerWalkable(x, y)) return { x, y };
  }
  return null;
}

function updateFarmers(dt) {
  for (const f of game.farmers) {
    f.phase += dt;

    if (f.inside) {
      if (dayPhase() !== 'night') { f.inside = false; f.wait = 0.5; }
      continue;
    }

    if (f.walking) {
      const dx = f.tx - f.gx, dy = f.ty - f.gy;
      const sdx = dx - dy, sdy = (dx + dy) * 0.5;
      if (sdx * sdx + sdy * sdy > 1e-6) {
        f.face = lerpAngle(f.face || 0, Math.atan2(sdy, sdx), Math.min(1, dt * 6));
        const fx = Math.cos(f.face);
        if (Math.abs(fx) >= 0.15) f.lastDir = fx >= 0 ? 1 : -1;
      }
      const dist = Math.hypot(dx, dy);
      const step = FARMER_SPEED * (f.riding ? 2.5 : 1) * dt;
      if (dist <= step) {
        f.gx = f.tx; f.gy = f.ty;
        f.walking = false;
        f.wait = 0.3;
      } else {
        f.gx += dx / dist * step;
        f.gy += dy / dist * step;
      }
      continue;
    }

    f.wait -= dt;
    if (f.wait > 0) continue;

    if (dayPhase() === 'night') {
      const door = houseDoorTile();
      if (door) {
        if (Math.hypot(door.x + 0.5 - f.gx, door.y + 0.5 - f.gy) < 0.9) {
          f.inside = true;
          f.walking = false;
          f.riding = false;
        } else {
          f.riding = false;
          f.tx = door.x + 0.5;
          f.ty = door.y + 0.5;
          f.walking = true;
        }
        continue;
      }
    }
    const job = farmerFindJob(f);

    if (job && job.kind === 'till') {
      const s = job.target;
      if (Math.hypot(s.x + 0.5 - f.gx, s.y + 0.5 - f.gy) < 0.9) {
        if (tillSoil(s.x, s.y)) spawnFloater(s.x, s.y, '\u26cf\ufe0f', '#a1887f');
        f.wait = 0.4;
      } else {
        f.riding = false;
        f.tx = s.x + 0.5; f.ty = s.y + 0.5;
        f.walking = true;
      }
      continue;
    }

    if (job && job.kind === 'water') {
      const c = job.target;
      if (Math.hypot(c.gx + 0.5 - f.gx, c.gy + 0.5 - f.gy) < 0.9) {
        if (waterCrop(c)) spawnFloater(c.gx, c.gy, '💧', '#4fc3f7');
        f.wait = 0.4;
      } else {
        f.riding = false;
        f.tx = c.gx + 0.5; f.ty = c.gy + 0.5;
        f.walking = true;
      }
      continue;
    }

    if (job && job.kind === 'harvest') {
      const c = job.target;
      if (Math.hypot(c.gx + 0.5 - f.gx, c.gy + 0.5 - f.gy) < 0.9) {
        const r = harvestCrop(c);
        if (r) spawnFloater(c.gx, c.gy, '+' + r.sell + ' 🪙', '#ffd54f');
        f.riding = false;
        f.wait = 0.4;
      } else {
        f.riding = hasHorse() && Math.hypot(c.gx + 0.5 - f.gx, c.gy + 0.5 - f.gy) > 5;
        f.tx = c.gx + 0.5; f.ty = c.gy + 0.5;
        f.walking = true;
      }
      continue;
    }

    if (job && job.kind === 'animal') {
      const a = job.target;
      if (Math.hypot(a.gx - f.gx, a.gy - f.gy) < 1.4) {
        collectAnimal(a);
        f.wait = 0.5;
      } else {
        f.riding = false;
        f.tx = a.gx; f.ty = a.gy;
        f.walking = true;
      }
      continue;
    }

    if (job && job.kind === 'plant') {
      let spot = f.jobSpot;
      if (!spot || occupancy[occIndex(spot.x, spot.y)]) {
        spot = farmerFindPlantSpot(f, job.type);
        if (!spot) { f.wait = 2; continue; }
        f.jobSpot = spot;
        f.jobType = job.type;
      }
      if (Math.hypot(spot.x + 0.5 - f.gx, spot.y + 0.5 - f.gy) < 0.9) {
        const crop = plantCrop(job.type, spot.x, spot.y, true);
        f.jobSpot = null;
        if (crop) {
          f.chest[job.type]--;
          if (f.chest[job.type] <= 0) delete f.chest[job.type];
          waterCrop(crop);
          spawnFloater(spot.x, spot.y, '🌱', '#aed581');
        }
        f.wait = 0.5;
      } else {
        f.riding = false;
        f.tx = spot.x + 0.5; f.ty = spot.y + 0.5;
        f.walking = true;
      }
      continue;
    }

    const cx = Math.floor(f.gx), cy = Math.floor(f.gy);
    const opts = [];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      if (farmerWalkable(cx + dx, cy + dy)) opts.push([cx + dx, cy + dy]);
    }
    if (opts.length) {
      const [nx, ny] = opts[Math.floor(Math.random() * opts.length)];
      f.tx = nx + 0.5; f.ty = ny + 0.5;
      f.walking = true;
    } else {
      f.wait = 2;
    }
  }
}

function drawFarmer(ctx, cam, cw, ch, f) {
  const p = projectPoint(f.gx, f.gy, 0);
  const s = worldToScreen(cam, p.x, p.y, cw, ch);
  const z = cam.zoom;
  const bob = f.walking ? Math.abs(Math.sin(f.phase * 8)) * 2.5 * z : Math.sin(f.phase * 2) * 0.6 * z;
  const legSwing = f.walking ? Math.sin(f.phase * 8) * 3 : 0;
  const armSwing = f.walking ? Math.sin(f.phase * 8 + Math.PI) * 2 : 0;
  const face = f.face || 0;
  const fx = Math.cos(face);
  const flip = Math.abs(fx) < 0.15 ? (f.lastDir || 1) : (fx >= 0 ? 1 : -1);
  const squash = Math.max(0.5, Math.abs(fx));

  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.scale(z * flip * squash, z);

  ctx.fillStyle = 'rgba(20,40,10,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 1, 8, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#5d4037';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(-2.5, -8); ctx.lineTo(-2.5 + legSwing, 0);
  ctx.moveTo(2.5, -8); ctx.lineTo(2.5 - legSwing, 0);
  ctx.stroke();

  ctx.fillStyle = '#4e342e';
  ctx.beginPath();
  ctx.ellipse(-2.5 + legSwing, 0.5, 2.2, 1.1, 0, 0, Math.PI * 2);
  ctx.ellipse(2.5 - legSwing, 0.5, 2.2, 1.1, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#3949ab';
  ctx.beginPath();
  ctx.rect(-5, -18 + bob * 0.4, 10, 11);
  ctx.fill();

  ctx.fillStyle = '#303f9f';
  ctx.fillRect(-5, -12 + bob * 0.4, 10, 2);

  ctx.fillStyle = '#a1887f';
  ctx.beginPath();
  ctx.rect(-3.5, -17 + bob * 0.4, 7, 8.5);
  ctx.fill();
  ctx.strokeStyle = '#8d6e63';
  ctx.lineWidth = 0.8;
  ctx.strokeRect(-3.5, -17 + bob * 0.4, 7, 8.5);
  ctx.beginPath();
  ctx.moveTo(-3.5, -17 + bob * 0.4); ctx.lineTo(-5, -18.5 + bob * 0.4);
  ctx.moveTo(3.5, -17 + bob * 0.4); ctx.lineTo(5, -18.5 + bob * 0.4);
  ctx.stroke();

  ctx.strokeStyle = '#c62828';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-5, -16 + bob * 0.4); ctx.lineTo(-8, -11 + armSwing + bob * 0.4);
  ctx.moveTo(5, -16 + bob * 0.4); ctx.lineTo(8, -11 - armSwing + bob * 0.4);
  ctx.stroke();
  ctx.strokeStyle = '#ffcc80';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-8, -12 + armSwing + bob * 0.4); ctx.lineTo(-8.5, -10 + armSwing + bob * 0.4);
  ctx.moveTo(8, -12 - armSwing + bob * 0.4); ctx.lineTo(8.5, -10 - armSwing + bob * 0.4);
  ctx.stroke();

  ctx.fillStyle = '#ffcc80';
  ctx.beginPath();
  ctx.arc(0, -22 + bob * 0.4, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#5d4037';
  ctx.beginPath();
  ctx.arc(1.5 - 1.2, -23.5 + bob * 0.4, 0.8, 0, Math.PI * 2);
  ctx.arc(1.5 + 1.2, -23.5 + bob * 0.4, 0.8, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#a1887f';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.arc(2, -21.6 + bob * 0.4, 1.6, 0.25, Math.PI - 0.25);
  ctx.stroke();

  ctx.fillStyle = '#e6c465';
  ctx.beginPath();
  ctx.ellipse(0, -24.5 + bob * 0.4, 7, 2.4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#d4af37';
  ctx.beginPath();
  ctx.ellipse(0, -25.8 + bob * 0.4, 4, 2, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

let LANG = 'pt-BR';

function t(key, params) {
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N['pt-BR'][key] || key;
  if (params) for (const k in params) s = s.replaceAll('{' + k + '}', params[k]);
  return s;
}

function applyLang() {
  LANG = game.settings.language || 'pt-BR';
  document.documentElement.lang = LANG;
  for (const el of document.querySelectorAll('[data-i18n]')) {
    el.textContent = t(el.dataset.i18n);
  }
}

/* ---------- Sons (WebAudio, sem arquivos externos) ---------- */
let audioCtx = null;

function getAudioCtx() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSound(kind) {
  if (!game.settings.sound) return;
  try {
    const ac = getAudioCtx();
    const notes = {
      click: [660, 0.05], place: [520, 0.12], remove: [220, 0.15],
      rotate: [440, 0.08], level: [784, 0.2], error: [180, 0.18],
      plant: [392, 0.1], water: [330, 0.12], harvest: [880, 0.16], dig: [180, 0.14]
    };
    const [freq, dur] = notes[kind] || notes.click;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + dur);
  } catch (e) { /* áudio indisponível */ }
}

/* ---------- Música ambiente (gerada, sem arquivos) ---------- */
const MELODY = [523.25, 659.25, 783.99, 659.25, 587.33, 783.99, 880, 783.99,
                659.25, 523.25, 587.33, 659.25, 523.25, 392, 440, 523.25];
const BASS = [130.81, 130.81, 174.61, 174.61, 196, 196, 130.81, 130.81];
let musicTimer = null;
let musicStep = 0;

function musicNote(freq, dur, vol, type) {
  const ac = getAudioCtx();
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ac.currentTime);
  gain.gain.linearRampToValueAtTime(vol, ac.currentTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(); osc.stop(ac.currentTime + dur);
}

function startMusic() {
  if (musicTimer) return;
  try {
    getAudioCtx();
    musicTimer = setInterval(() => {
      if (!game.settings.music) { stopMusic(); return; }
      musicNote(MELODY[musicStep % MELODY.length], 0.9, 0.045, 'triangle');
      if (musicStep % 2 === 0) {
        musicNote(BASS[(musicStep / 2) % BASS.length], 1.8, 0.03, 'sine');
      }
      musicStep++;
    }, 450);
  } catch (e) { /* áudio indisponível */ }
}

function stopMusic() {
  clearInterval(musicTimer);
  musicTimer = null;
}

/* ---------- Toast ---------- */
let toastTimer = null;
function showToast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => el.classList.add('hidden'), 300);
  }, 2200);
}

/* ---------- HUD ---------- */
let lastDayPhase = null;
let lastClockStr = '';
const PHASE_ICONS = { dawn: '🌅', day: '☀', afternoon: '🌤', night: '🌙' };

function refreshHud() {
  const phase = dayPhase();
  const clock = clockString(game.time);
  if (phase !== lastDayPhase || clock !== lastClockStr) {
    lastDayPhase = phase;
    lastClockStr = clock;
    const chip = $('day-chip');
    if (chip) chip.textContent = PHASE_ICONS[phase] + ' ' + clock;
  }
  const dogBtn = $('btn-dog');
  if (dogBtn) {
    dogBtn.classList.toggle('hidden', !game.dog);
    dogBtn.classList.toggle('active', !!(game.dog && game.dog.active));
  }
  if (uiDirty.coins) { $('coins-value').textContent = game.coins.toLocaleString('pt-BR'); uiDirty.coins = false; }
  if (uiDirty.gems) { $('gems-value').textContent = game.gems; uiDirty.gems = false; }
  if (uiDirty.xp) {
    $('level-text').textContent = 'Nível ' + game.level;
    $('farm-name').textContent = game.farmName;
    const need = xpForLevel(game.level);
    $('xp-fill').style.width = Math.min(100, (game.xp / need) * 100) + '%';
    uiDirty.xp = false;
  }
}

/* ---------- Modais ---------- */
function openModal(title, bodyBuilder) {
  $('modal-title').textContent = title;
  const body = $('modal-body');
  body.innerHTML = '';
  bodyBuilder(body);
  $('modal-overlay').classList.remove('hidden');
  playSound('click');
}

function closeModal() { $('modal-overlay').classList.add('hidden'); }

/* ---------- Painel de gestao dos predios ---------- */
const COIN_ICON = '\u{1FA99}';
function openBuildingPanel(type) {
  openModal(t('bld.' + type), body => {
    const mkRow = (label, value) => {
      const row = document.createElement('div');
      row.className = 'bld-row';
      const l = document.createElement('span');
      l.textContent = label;
      const v = document.createElement('strong');
      v.textContent = value;
      row.appendChild(l);
      row.appendChild(v);
      body.appendChild(row);
    };
    if (type === 'house') {
      const phase = dayPhase();
      mkRow(t('bld.coins'), COIN_ICON + ' ' + game.coins.toLocaleString('pt-BR'));
      mkRow(t('bld.level'), String(game.level));
      mkRow(t('bld.total'), String(game.animals.length));
      mkRow(t('bld.farmers'), String(game.farmers.length));
      mkRow(t('bld.phase'), PHASE_ICONS[phase] + ' ' + t('phase.' + phase));
    } else {
      const kinds = { coop: ['chicken'], stable: ['cow'], barn: ['pig'] }[type];
      let n = 0;
      for (const k of kinds) n += game.animals.filter(a => a.kind === k).length;
      mkRow(t('bld.count'), String(n));
      if (type === 'coop') body.appendChild(mkInfo(t('bld.eggInfo')));
      if (type === 'stable') body.appendChild(mkInfo(t('bld.milkInfo')));
      if (type === 'barn') body.appendChild(mkInfo(t('bld.baconInfo')));
    }
  });
}

function mkInfo(text) {
  const d = document.createElement('div');
  d.className = 'bld-info';
  d.textContent = text;
  return d;
}

/* ---------- Loja ---------- */
let currentShopTab = 'construcoes';

function openShop() {
  openModal(t('modal.shop'), body => {
    const tabs = document.createElement('div');
    tabs.className = 'shop-tabs';
    for (const cat of SHOP_CATEGORIES) {
      const btn = document.createElement('button');
      btn.className = 'shop-tab' + (cat.id === currentShopTab ? ' active' : '');
      btn.textContent = t('cat.' + cat.id);
      btn.onclick = () => { currentShopTab = cat.id; openShop(); };
      tabs.appendChild(btn);
    }
    body.appendChild(tabs);

    const grid = document.createElement('div');
    grid.className = 'shop-grid';
    if (currentShopTab === 'animais') {
      for (const def of Object.values(ANIMALS)) {
        const locked = game.level < def.level;
        const afford = game.coins >= def.price;
        const full = game.animals.filter(a => a.kind === def.id).length >= MAX_PER_KIND;
        const item = document.createElement('div');
        item.className = 'shop-item';
        item.innerHTML = `
          <div class="shop-item-icon">${def.icon}</div>
          <div class="shop-item-name">${t('an_' + def.id)}</div>
          <div class="shop-item-desc" style="font-size:11px;color:#6d4c41;text-align:center">${t('an_' + def.id + '_desc')}</div>
          <div class="shop-item-price">🪙 ${def.price.toLocaleString('pt-BR')}</div>
          ${locked ? `<div class="shop-item-locked">${t('shop.locked', { n: def.level })}</div>` : ''}
        `;
        const buyBtn = document.createElement('button');
        buyBtn.className = 'shop-buy-btn';
        buyBtn.textContent = locked ? t('shop.locked', { n: def.level }) : (!afford ? t('shop.noCoins') : (full ? t('toast.animalLimit') : t('shop.buyAnimal')));
        buyBtn.disabled = locked || !afford || full;
        buyBtn.onclick = () => {
          if (buyAnimal(def.id)) {
            showToast(t('toast.animalBought', { icon: def.icon, name: t('an_' + def.id) }));
            refreshHud();
            openShop();
          }
        };
        item.appendChild(buyBtn);
        grid.appendChild(item);
      }
      body.appendChild(grid);
      return;
    }
    if (currentShopTab === 'ajudantes') {
      for (const def of Object.values(HELPERS)) {
        const locked = game.level < def.level;
        const price = def.id === 'farmer' ? farmerPrice() : def.price;
        const owned = def.id === 'dog' && game.dog;
        const afford = game.coins >= price;
        const item = document.createElement('div');
        item.className = 'shop-item';
        item.innerHTML = `
          <div class="shop-item-icon">${def.icon}</div>
          <div class="shop-item-name">${t('h_' + def.id)}</div>
          <div class="shop-item-desc" style="font-size:11px;color:#6d4c41;text-align:center">${t('h_' + def.id + '_desc')}</div>
          <div class="shop-item-price">🪙 ${price.toLocaleString('pt-BR')}</div>
          ${locked ? `<div class="shop-item-locked">${t('shop.locked', { n: def.level })}</div>` : ''}
        `;
        const buyBtn = document.createElement('button');
        buyBtn.className = 'shop-buy-btn';
        const buyLabel = def.id === 'farmer' ? t('shop.hire') : t('shop.buyAnimal');
        buyBtn.textContent = locked ? t('shop.locked', { n: def.level }) : (owned ? t('shop.dogOwned') : (!afford ? t('shop.noCoins') : buyLabel));
        buyBtn.disabled = locked || !afford || owned;
        buyBtn.onclick = () => {
          const ok = def.id === 'farmer' ? buyFarmer() : buyDog();
          if (ok) {
            showToast(def.id === 'farmer' ? t('toast.farmerBought') : t('toast.dogBought'));
            refreshHud();
            openShop();
          }
        };
        item.appendChild(buyBtn);
        grid.appendChild(item);
      }
      body.appendChild(grid);
      return;
    }
    for (const def of Object.values(BUILDINGS)) {
      if (def.category !== currentShopTab) continue;
      const locked = game.level < def.level;
      const afford = game.coins >= def.price;
      const item = document.createElement('div');
      item.className = 'shop-item';
      item.innerHTML = `
        <div class="shop-item-icon">${def.icon}</div>
        <div class="shop-item-name">${t('b_' + def.id)}</div>
        <div class="shop-item-size">${def.w}×${def.d} tiles</div>

function openSettings() {
  openModal(t('modal.settings'), body => {
    const rows = [
      { label: t('settings.sound'), key: 'sound', type: 'toggle' },
      { label: t('settings.music'), key: 'music', type: 'toggle' },
      { label: t('settings.quality'), key: 'quality', type: 'select',
        options: ['baixa', 'média', 'alta'], translate: true },
      { label: t('settings.language'), key: 'language', type: 'select',
        options: ['pt-BR', 'en-US'], translate: false }
    ];
    for (const r of rows) {
      const row = document.createElement('div');
      row.className = 'settings-row';
      row.innerHTML = `<span>${r.label}</span>`;
      let input;
      if (r.type === 'toggle') {
        input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = game.settings[r.key];
        input.onchange = () => {
          game.settings[r.key] = input.checked;
          playSound('click');
          if (r.key === 'music') {
            if (input.checked) startMusic(); else stopMusic();
          }
          saveGame(false);
        };
      } else {
        input = document.createElement('select');
        for (const opt of r.options) {
          const o = document.createElement('option');
          o.value = opt;
          o.textContent = r.translate ? t('q.' + opt) : opt;
          if (game.settings[r.key] === opt) o.selected = true;
          input.appendChild(o);
        }
        input.onchange = () => {
          game.settings[r.key] = input.value;
          playSound('click');
          if (r.key === 'language') applyLang();
          saveGame(false);

    const item = document.createElement('button');

function bindUi(handlers) {
  $('btn-settings').onclick = openSettings;
  $('btn-add-coins').onclick = openCoinShop;
  $('btn-add-gems').onclick = openGemShop;
  $('btn-build').onclick = () => handlers.build();
  $('btn-till').onclick = () => handlers.till();
  $('btn-plant').onclick = () => handlers.plant();
  $('btn-water').onclick = () => handlers.water();
  $('btn-harvestall').onclick = () => handlers.harvestAll();
  $('btn-collectall').onclick = () => handlers.collectAll();
  $('btn-pen').onclick = () => handlers.pen();
  $('btn-dog').onclick = () => handlers.dog();
  $('btn-move').onclick = () => handlers.move();
  $('btn-remove').onclick = () => handlers.remove();
  $('btn-rotate').onclick = () => handlers.rotate();
  $('btn-zoom-in').onclick = () => zoomHandlers.zoomIn();
  $('btn-zoom-out').onclick = () => zoomHandlers.zoomOut();
  $('btn-zoom-reset').onclick = () => zoomHandlers.zoomReset();
  $('btn-buy').onclick = openBuyMenu;
  $('btn-collapse-left').onclick = () => {
    document.body.classList.toggle('tools-left-hidden');
    playSound('click');
  };
  $('btn-collapse-right').onclick = () => {
    document.body.classList.toggle('tools-right-hidden');
    playSound('click');
  };

  for (const btn of document.querySelectorAll('.side-btn')) {
    btn.onclick = () => {
      const panel = btn.dataset.panel;
      if (panel === 'missions') openMissions();
      else if (panel === 'shop') openShop();
      else if (panel === 'achievements') openAchievements();
      else if (panel === 'friends') openFriends();
      else if (panel === 'farmers') openFarmersPanel();
    };
  }

  $('modal-close').onclick = closeModal;
  $('modal-overlay').onclick = e => { if (e.target === $('modal-overlay')) closeModal(); };

  $('dialog-ok').onclick = () => {
    $('dialog-overlay').classList.add('hidden');
    if (dialogCallback) dialogCallback();
    dialogCallback = null;
  };
  $('dialog-cancel').onclick = () => { $('dialog-overlay').classList.add('hidden'); dialogCallback = null; };

  $('confirm-ok').onclick = () => handlers.confirmOk();
  $('confirm-cancel').onclick = () => handlers.confirmCancel();

  // música só pode iniciar após um gesto do usuário (política de autoplay)
  document.addEventListener('pointerdown', () => {
    if (game.settings.music) startMusic();
  }, { once: true });
}

</script>
<script>
/* ================= FAZENDA 3D — INICIALIZAÇÃO, ENTRADA E LOOP ================= */

const canvas = $('game-canvas');
const ctx = canvas.getContext('2d');

const cam = { x: 0, y: 0, zoom: 1 };
const MIN_ZOOM = 0.35, MAX_ZOOM = 3;

const state = {
  mode: 'idle',        // idle | build | move | remove | rotate
  ghost: null,         // {type, gx, gy, rot, valid}
  moveId: null,
  rotateId: null,
  ghostPinned: false,  // posição fixa aguardando confirmação
  highlightTile: null,
  selectedSeed: 'wheat'
};

let lastPointerGrid = { gx: 12, gy: 12 };

/* ---------- Canvas / resize ---------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(canvas.clientWidth * dpr);
  canvas.height = Math.floor(canvas.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

/* ---------- Câmera ---------- */
function centerCamera() {
  const c = projectPoint((game.ownedArea.x0 + game.ownedArea.x1 + 1) / 2,
                         (game.ownedArea.y0 + game.ownedArea.y1 + 1) / 2, 0);
  cam.x = c.x; cam.y = c.y;
}

function clampCamera() {
  const limit = GRID_SIZE * TILE_W / 2 + 200;
  cam.x = Math.max(-limit, Math.min(limit, cam.x));
  cam.y = Math.max(-limit, Math.min(limit, cam.y));
}

function zoomAt(sx, sy, factor) {
  const before = screenToWorld(cam, sx, sy, canvas.clientWidth, canvas.clientHeight);
  cam.zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, cam.zoom * factor));
  const after = screenToWorld(cam, sx, sy, canvas.clientWidth, canvas.clientHeight);
  cam.x += before.x - after.x;
  cam.y += before.y - after.y;
  clampCamera();
  dbgShowZoom();
}

/* ---------- Diagnostico na tela ---------- */
const GAME_VERSION = 'v19';
const dbgBadge = $('debug-badge');
function dbgShowZoom() {
  if (dbgBadge && !dbgBadge.classList.contains('dbg-error')) {
    dbgBadge.textContent = GAME_VERSION + ' \u00b7 zoom ' + cam.zoom.toFixed(2) + 'x';
  }
}
window.addEventListener('error', e => {
  if (!dbgBadge) return;
  dbgBadge.textContent = 'ERRO ' + GAME_VERSION + ': ' + (e.message || 'desconhecido');
  dbgBadge.classList.add('dbg-error');
});

/* ---------- Entrada: gestos unificados (Pointer Events + fallback touch) ---------- */
const pointer = { down: false, dragging: false, sx: 0, sy: 0, cx: 0, cy: 0 };
const activePointers = new Map();
let gesture = null;
let lastTap = { t: 0, x: 0, y: 0 };

function eventPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function gridFromEvent(e) {
  const p = eventPos(e);
  const w = screenToWorld(cam, p.x, p.y, canvas.clientWidth, canvas.clientHeight);
  lastPointerGrid = screenToGrid(w.x, w.y);
  return lastPointerGrid;
}

function updateGhostFollow() {
  if (!state.ghostPinned && state.ghost &&
      (state.mode === 'build' || (state.mode === 'move' && state.moveId))) {
    updateGhostPosition(lastPointerGrid.gx, lastPointerGrid.gy);
  }
}

function beginPinch() {
  const [a, b] = [...activePointers.values()];
  gesture = {
    type: 'pinch',
    dist: Math.hypot(a.x - b.x, a.y - b.y)
  };
}

function onDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.pointerType === 'mouse') {
    pointer.down = true; pointer.dragging = false;
    pointer.sx = e.clientX; pointer.sy = e.clientY;
    pointer.cx = cam.x; pointer.cy = cam.y;
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* sem captura */ }
  activePointers.set(e.pointerId, eventPos(e));
  if (activePointers.size === 1) {
    gesture = { type: 'pending', sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y };
    gridFromEvent(e);
  } else if (activePointers.size >= 2) {
    beginPinch();
  }
}

function onMove(e) {
  if (!activePointers.has(e.pointerId)) {
    if (e.pointerType === 'mouse') { gridFromEvent(e); updateGhostFollow(); }
    return;
  }
  activePointers.set(e.pointerId, eventPos(e));
  if (!gesture) return;

  if (gesture.type === 'pending') {
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (Math.abs(dx) + Math.abs(dy) > 8) gesture.type = 'drag';
  }

  if (gesture.type === 'drag') {
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    cam.x = gesture.cx - dx / cam.zoom;
    cam.y = gesture.cy - dy / cam.zoom;
    clampCamera();
    canvas.classList.add('dragging');
    gridFromEvent(e);
  } else if (gesture.type === 'pinch' && activePointers.size >= 2) {
    const [a, b] = [...activePointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (gesture.dist > 0 && d > 0) zoomAt(mid.x, mid.y, d / gesture.dist);
    gesture.dist = d;
  }
  updateGhostFollow();
}

function onEnd(e) {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.delete(e.pointerId);
  canvas.classList.remove('dragging');

  const wasTap = gesture && gesture.type === 'pending';
  const wasMouse = e.pointerType === 'mouse';
  if (wasMouse) pointer.down = false;

  if (activePointers.size === 0) {
    gesture = null;
    if (wasTap) {
      const now = performance.now();
      const near = Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40;
      if (!wasMouse && now - lastTap.t < 320 && near) {
        const p = eventPos(e);
        zoomAt(p.x, p.y, 1.5);
        lastTap = { t: 0, x: 0, y: 0 };
      } else {
        lastTap = { t: now, x: e.clientX, y: e.clientY };
      }
      handleClick(e);
    }
  } else if (activePointers.size === 1) {
    const [p] = [...activePointers.values()];
    const rect = canvas.getBoundingClientRect();
    gesture = { type: 'drag', sx: rect.left + p.x, sy: rect.top + p.y, cx: cam.x, cy: cam.y };
    if (wasMouse) { pointer.dragging = true; }
  } else {
    beginPinch();
  }
}

if (window.PointerEvent) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onEnd);
  canvas.addEventListener('pointercancel', onEnd);
} else {
  const toSynthetic = t => ({
    pointerId: t.identifier, pointerType: 'touch',
    clientX: t.clientX, clientY: t.clientY
  });
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) onDown(toSynthetic(t));
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) onMove(toSynthetic(t));
  }, { passive: false });
  canvas.addEventListener('touchend', e => {
    for (const t of e.changedTouches) onEnd(toSynthetic(t));
  }, { passive: false });
  canvas.addEventListener('touchcancel', e => {
    for (const t of e.changedTouches) onEnd(toSynthetic(t));
  }, { passive: false });
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const p = eventPos(e);
  zoomAt(p.x, p.y, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

/* ---------- Clique no mundo ---------- */
function handleClick(e) {
  const g = gridFromEvent(e);

  if (state.mode === 'build' && state.ghost) {
    if (state.ghostPinned) {
      // novo clique reposiciona o fantasma em vez de ficar preso
      state.ghostPinned = false;
      hideConfirmBar();
      updateGhostPosition(g.gx, g.gy);
      if (state.ghost.valid) {
        state.ghostPinned = true;
        const def = BUILDINGS[state.ghost.type];
        showConfirmBar(t('confirm.build', { icon: def.icon, name: t('b_' + def.id), price: def.price.toLocaleString('pt-BR') }));
      }
      return;
    }
    updateGhostPosition(g.gx, g.gy);
    if (state.ghost.valid) {
      state.ghostPinned = true;
      const def = BUILDINGS[state.ghost.type];
      showConfirmBar(t('confirm.build', { icon: def.icon, name: t('b_' + def.id), price: def.price.toLocaleString('pt-BR') }));
    } else {
      playSound('error');
      showToast(t('toast.invalid'));
    }
    return;
  }

  if (state.mode === 'pen') {
    const n = state.penSize || 8;
    if (placePen(g.gx, g.gy, n)) {
      showToast(t('toast.penPlaced', { n }));
      refreshHud();
      setMode('idle');
    }
    return;
  }

  if (state.mode === 'till') {
    if (!inOwnedArea(g.gx, g.gy)) { showToast(t('toast.invalid')); return; }
    if (buildingAt(g.gx, g.gy)) { showToast(t('toast.tileBusy')); return; }
    if (tillSoil(g.gx, g.gy)) {
      spawnFloater(g.gx, g.gy, '⛏️', '#a1887f');
    }
    return;
  }

  if (state.mode === 'plant') {
    if (!inOwnedArea(g.gx, g.gy)) { showToast(t('toast.invalid')); return; }
    if (buildingAt(g.gx, g.gy)) { showToast(t('toast.tileBusy')); return; }
    const crop = plantCrop(state.selectedSeed, g.gx, g.gy);
    if (crop) {
      const def = CROPS[crop.type];
      spawnFloater(g.gx, g.gy, '-' + def.seedCost + ' 🪙', '#ffd54f');
      showToast(t('toast.planted', { icon: def.icon, name: t('c_' + def.id) }));
      refreshHud();
      autoClaimReady();
    }
    return;
  }

  if (state.mode === 'water') {
    const occ = buildingAt(g.gx, g.gy);
    if (occ && occ.isCrop) {
      if (cropProgress(occ) >= 1) { doHarvest(occ); return; }
      if (waterCrop(occ)) {
        spawnFloater(occ.gx, occ.gy, '💧', '#4fc3f7');
        showToast(t('toast.watered'));
      } else {
        showToast(t('toast.alreadyWatered'));
      }
    } else {
      showToast(t('toast.waterHint'));
    }
    return;
  }

  if (state.mode === 'move') {
    if (!state.moveId) {
      const sel = buildingAt(g.gx, g.gy);
      if (!sel) { showToast(t('toast.clickBuilding')); return; }
      if (sel.isCrop) { showToast(t('toast.cropNoMove')); return; }
      state.moveId = sel.id;
      state.ghost = { type: sel.type, gx: sel.gx, gy: sel.gy, rot: sel.rot, valid: true };
      showToast(t('toast.moveSelect'));
      return;
    }
    if (state.ghostPinned) {
      state.ghostPinned = false;
      hideConfirmBar();
      updateGhostPosition(g.gx, g.gy);
      if (state.ghost.valid) {
        state.ghostPinned = true;
        showConfirmBar(t('confirm.move'));
      }
      return;
    }
    updateGhostPosition(g.gx, g.gy);
    if (state.ghost.valid) {
      state.ghostPinned = true;
      showConfirmBar(t('confirm.move'));
    } else {
      playSound('error');
      showToast(t('toast.invalid'));
    }
    return;
  }

  const b = buildingAt(g.gx, g.gy);

  if (state.mode === 'remove') {
    if (b && b.isCrop) {
      const def = CROPS[b.type];
      const refund = Math.floor(def.seedCost * 0.5);
      confirmDialog(
        t('dialog.removeCropText', { icon: def.icon, name: t('c_' + def.id), refund: refund.toLocaleString('pt-BR') }),
        () => {
          const r = removeCrop(b);
          if (r) showToast(t('toast.removed', { refund: r.refund.toLocaleString('pt-BR') }));
          refreshHud();
        });
      return;
    }
    if (b) {
      const def = BUILDINGS[b.type];
      const refund = Math.floor(def.price * def.refund);
      confirmDialog(
        t('dialog.removeText', { icon: def.icon, name: t('b_' + def.id), refund: refund.toLocaleString('pt-BR') }),
        () => {
          const r = removeBuilding(b.id);
          if (r) showToast(t('toast.removed', { refund: r.refund.toLocaleString('pt-BR') }));
          refreshHud();
          autoClaimReady();
        });
    } else {
      showToast(t('toast.removeHint'));
    }
    return;
  }

  if (state.mode === 'rotate') {
    if (b) {
      if (b.isCrop) { showToast(t('toast.cropNoMove')); return; }
      const def = BUILDINGS[b.type];
      if (def.w === 1 && def.d === 1) {
        showToast(t('toast.noRotate'));
        return;
      }
      state.rotateId = b.id;
      const newRot = (b.rot + 1) % 4;
      const valid = canPlace(b.type, b.gx, b.gy, newRot, b.id);
      state.ghost = { type: b.type, gx: b.gx, gy: b.gy, rot: newRot, valid };
      state.ghostPinned = true;
      showConfirmBar(t('confirm.rotate'));
    } else {
      showToast(t('toast.rotateHint'));
    }
    return;
  }

  if (state.mode === 'idle') {
    for (const f of game.farmers) {
      if (f.inside) continue;
      if (Math.hypot(f.gx - (g.gx + 0.5), f.gy - (g.gy + 0.5)) < 0.9) {
        openFarmerChest(f);
        return;
      }
    }
    let nearest = null, nd = Infinity;
    for (const a of game.animals) {
      const d = Math.hypot(a.gx - (g.gx + 0.5), a.gy - (g.gy + 0.5));
      if (d < 0.9 && d < nd) { nd = d; nearest = a; }
    }
    if (nearest) {
      if (collectAnimal(nearest)) {
        refreshHud();
        autoClaimReady();
      } else if (nearest.kind === 'pig') {
        showToast(t('toast.pigYoung'));
      } else {
        showToast(t('toast.animalNotReady'));
      }
      return;
    }
    const bld = buildingAt(g.gx, g.gy);
    if (bld && ['house', 'barn', 'stable', 'coop'].includes(bld.type)) {
      openBuildingPanel(bld.type);
      return;
    }
  }

  // modo normal: colher plantação pronta ou destacar construção
  if (b && b.isCrop) {
    const p = cropProgress(b);
    if (p >= 1) {
      doHarvest(b);
    } else {
      showToast(t('toast.notReady', { p: Math.floor(p * 100) }));
    }
    return;
  }

  if (b) {
    const def = BUILDINGS[b.type];
    state.highlightTile = { gx: b.gx, gy: b.gy };
    showToast(t('toast.highlight', { icon: def.icon, name: t('b_' + def.id) }));
    setTimeout(() => { state.highlightTile = null; }, 1200);
  }
}

/* ---------- Fantasma ---------- */
function updateGhostPosition(gx, gy) {
  if (!state.ghost) return;
  const g = state.ghost;
  const f = footprintOf(g.type, g.rot);
  g.gx = Math.max(0, Math.min(GRID_SIZE - f.w, gx));
  g.gy = Math.max(0, Math.min(GRID_SIZE - f.d, gy));
  g.valid = canPlace(g.type, g.gx, g.gy, g.rot, state.moveId || undefined);
}

/* ---------- Modos ---------- */
function setMode(mode) {
  state.mode = mode;
  state.ghost = null;
  state.ghostPinned = false;
  state.moveId = null;
  state.rotateId = null;
  hideConfirmBar();
  if (mode !== 'plant') hideSeedBar();
  canvas.classList.remove('mode-build', 'mode-move', 'mode-remove', 'mode-rotate', 'mode-plant', 'mode-water', 'mode-till', 'mode-pen');
  if (mode !== 'idle') canvas.classList.add('mode-' + mode);
  for (const btn of document.querySelectorAll('.build-btn')) btn.classList.remove('active');
  const map = { build: 'btn-build', move: 'btn-move', remove: 'btn-remove', rotate: 'btn-rotate', plant: 'btn-plant', water: 'btn-water', pen: 'btn-pen' };
  if (map[mode]) $(map[mode]).classList.add('active');
}

function enterBuildMode(typeId) {
  setMode('build');
  const def = BUILDINGS[typeId];
  state.ghost = { type: typeId, gx: lastPointerGrid.gx, gy: lastPointerGrid.gy, rot: 0, valid: false };
  updateGhostPosition(lastPointerGrid.gx, lastPointerGrid.gy);
  showToast(t('toast.buildHint', { icon: def.icon }));
}

const uiHandlers = {
  build() {
    if (state.mode === 'build' && !state.ghostPinned) { setMode('idle'); return; }
    playSound('click');
    openShop();
  },
  move() {
    playSound('click');
    if (state.mode === 'move') { setMode('idle'); return; }
    setMode('move');
    showToast(t('toast.moveHint'));
  },
  remove() {
    playSound('click');
    if (state.mode === 'remove') { setMode('idle'); return; }
    setMode('remove');
    showToast(t('toast.removeHint'));
  },
  rotate() {
    playSound('click');
    if (state.mode === 'rotate') { setMode('idle'); return; }
    setMode('rotate');
    showToast(t('toast.rotateHint'));
  },
  confirmOk() {
    if (state.mode === 'build' && state.ghost) {
      const b = placeBuilding(state.ghost.type, state.ghost.gx, state.ghost.gy, state.ghost.rot);
      if (b) {
        showToast(t('toast.built', { icon: BUILDINGS[b.type].icon, name: t('b_' + b.type) }));
        autoClaimReady();
        refreshHud();
        // continua no modo construir, fantasma livre a partir do cursor
        const type = state.ghost.type;
        setMode('build');
        state.ghost = { type, gx: lastPointerGrid.gx, gy: lastPointerGrid.gy, rot: 0, valid: false };
        updateGhostPosition(lastPointerGrid.gx, lastPointerGrid.gy);
      }
    } else if (state.mode === 'move' && state.moveId && state.ghost) {
      if (moveBuilding(state.moveId, state.ghost.gx, state.ghost.gy, state.ghost.rot)) {
        showToast(t('toast.moved'));
        autoClaimReady();
      }
      setMode('idle');
    } else if (state.mode === 'rotate' && state.rotateId) {
      if (rotateBuilding(state.rotateId)) {
        showToast(t('toast.rotated'));
      } else {
        playSound('error');
        showToast(t('toast.rotateNoSpace'));
      }
      setMode('idle');
    } else {
      hideConfirmBar();
    }
  },
  confirmCancel() {
    setMode('idle');
  },
  plant() {
    playSound('click');
    if (state.mode === 'plant') { setMode('idle'); return; }
    setMode('plant');
    buildSeedBar();
    showToast(t('toast.plantHint'));
  },
  water() {
    playSound('click');
    if (state.mode === 'water') { setMode('idle'); return; }
    setMode('water');
    showToast(t('toast.waterHint'));
  },
  till() {
    playSound('click');
    if (state.mode === 'till') { setMode('idle'); return; }
    setMode('till');
    showToast(t('toast.tillHint'));
  },
  harvestAll() {
    playSound('click');
    const r = harvestAllCrops();
    if (r.n > 0) {
      showToast(t('toast.harvestAll', { n: r.n, c: r.coins }));
      refreshHud();
      autoClaimReady();
    } else {
      showToast(t('toast.noneReady'));
    }
  },
  pen() {
    playSound('click');
    openPenModal();
  },
  dog() {
    playSound('click');
    if (!game.dog) { showToast(t('toast.noDog')); return; }
    if (!game.dog.active && !game.pen) { showToast(t('toast.needPen')); return; }
    game.dog.active = !game.dog.active;
    showToast(game.dog.active ? t('toast.dogOn') : t('toast.dogOff'));
    refreshHud();
  },
  collectAll() {
    playSound('click');
    const r = collectAllProducts();
    if (r.n > 0) {
      showToast(t('toast.collectAll', { n: r.n, c: r.coins }));
      refreshHud();
      autoClaimReady();
    } else {
      showToast(t('toast.nothingToCollect'));
    }
  }
};

function zoomStep(factor) {
  zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, factor);
}

const zoomHandlers = {
  zoomIn() { playSound('click'); zoomStep(1.25); },
  zoomOut() { playSound('click'); zoomStep(1 / 1.25); },
  zoomReset() {
    playSound('click');
    cam.zoom = canvas.clientWidth < 520 ? 0.72 : 1;
    centerCamera();
  }
};

function doHarvest(crop) {
  const r = harvestCrop(crop);
  if (r) {
    spawnFloater(crop.gx, crop.gy, '+' + r.sell + ' 🪙', '#ffd54f');
    spawnFloater(crop.gx - 0.4, crop.gy - 0.4, '+' + r.xp + ' XP', '#aed581');
    showToast(t('toast.harvested', { icon: r.def.icon, c: r.sell, x: r.xp }));
    refreshHud();
    autoClaimReady();
  }
}

/* ---------- Teclado ---------- */
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('modal-overlay').classList.contains('hidden')) { closeModal(); return; }
    if (!$('dialog-overlay').classList.contains('hidden')) {
      $('dialog-overlay').classList.add('hidden');
      dialogCallback = null;
      return;
    }
    setMode('idle');
    return;
  }
  if ((e.key === 'r' || e.key === 'R') && state.ghost && !state.ghostPinned &&
      (state.mode === 'build' || state.mode === 'move')) {
    state.ghost.rot = (state.ghost.rot + 1) % 4;
    updateGhostPosition(state.ghost.gx, state.ghost.gy);
  }
  if (e.key === 'Enter' && state.ghostPinned) uiHandlers.confirmOk();
});

/* ---------- Salvamento ao sair ---------- */
window.addEventListener('beforeunload', () => saveGame(false));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveGame(false);
});

/* ---------- Loop ---------- */
let lastTime = 0;
let autosaveAcc = 0;

function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 1);
  lastTime = ts;
  try {
    game.time = (game.time + dt / DAY_LENGTH) % 1;
    updateAnimals(dt);
    updateFarmers(dt);
    updateDog(dt);
    render(ctx, cam, canvas.clientWidth, canvas.clientHeight, state);
    refreshHud();
  } catch (err) {
    if (dbgBadge) {
      dbgBadge.textContent = 'ERRO ' + GAME_VERSION + ': ' + err.message;
      dbgBadge.classList.add('dbg-error');
    }
  }
  autosaveAcc += dt;
  if (autosaveAcc > 15) { autosaveAcc = 0; saveGame(false); }
  requestAnimationFrame(loop);
}

/* ---------- Início ---------- */
function init() {
  resize();
  const loaded = loadGame();
  if (!loaded) {
    // propriedade inicial: casa e poço já construídos
    placeBuilding('house', 12, 12, 0, true);
    placeBuilding('well', 16, 16, 0, true);
    saveGame(false);
  }
  game.stats.level = game.level;
  game.stats.peak_coins = Math.max(game.stats.peak_coins || 0, game.coins);
  spawnAnimals();
  applyLang();
  centerCamera();
  if (canvas.clientWidth < 520) cam.zoom = 0.72;
  dbgShowZoom();
  bindUi(uiHandlers);
  refreshHud();
  requestAnimationFrame(loop);
  if (!loaded) showToast(t('toast.welcome'));
}

init();

</script>
