<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fazenda 3D — Simulador Isométrico</title>
<meta name="theme-color" content="#5da03f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=48">
</head>
<body>
<canvas id="game-canvas"></canvas>

<!-- ================= HUD SUPERIOR ================= -->
<div id="hud-top">
  <div id="profile-card" class="hud-card">
    <div id="avatar">🧑‍🌾</div>
    <div id="profile-info">
      <div id="farm-name">Fazenda do Jogador</div>
      <div id="level-row">
        <span id="level-star">⭐</span>
        <span id="level-text">Nível 1</span>
        <div id="xp-bar"><div id="xp-fill"></div></div>
      </div>
    </div>
  </div>

  <div id="currencies">
    <div class="currency hud-card" id="coins-card">
      <span class="cur-icon">🪙</span>
      <span id="coins-value">0</span>
      <button id="btn-add-coins" title="Loja de moedas">＋</button>
    </div>
    <div class="currency hud-card" id="gems-card">
      <span class="cur-icon">💎</span>
      <span id="gems-value">0</span>
      <button id="btn-add-gems" title="Loja de diamantes">＋</button>
    </div>
    <div id="day-chip" class="hud-card" title="Relógio e calendário">☀️</div>
    <button id="btn-settings" class="hud-card" title="Configurações">⚙️</button>
  </div>
</div>

<!-- ================= MENU LATERAL ================= -->
<div id="visit-banner" class="hidden"><span id="visit-label">👀 Modo visita</span><button id="btn-leave-visit">🏡 Voltar</button></div>
<div id="side-menu">
  <button class="side-btn" id="btn-build"><span class="side-icon">🧱</span><span class="side-label" data-i18n="build.build">Construir</span></button>
  <button class="side-btn" id="btn-buy"><span class="side-icon">🛒</span><span class="side-label" data-i18n="build.buy">Comprar</span></button>
  <button class="side-btn" data-panel="missions"><span class="side-icon">📋</span><span class="side-label" data-i18n="menu.missions">Missões</span></button>
  <button class="side-btn" data-panel="barn"><span class="side-icon">🧺</span><span class="side-label" data-i18n="menu.barn">Celeiro</span></button>
  <button class="side-btn" data-panel="shop"><span class="side-icon">🏪</span><span class="side-label" data-i18n="menu.shop">Loja</span></button>
  <button class="side-btn" data-panel="achievements"><span class="side-icon">🏆</span><span class="side-label" data-i18n="menu.achievements">Conquistas</span></button>
  <button class="side-btn" data-panel="farmers"><span class="side-icon">🧑‍🌾</span><span class="side-label" data-i18n="menu.farmers">Fazendeiros</span></button>
  <button class="side-btn" data-panel="multiplayer"><span class="side-icon">🌐</span><span class="side-label" data-i18n="menu.multiplayer">Multiplayer</span></button>
</div>

<!-- ================= BARRA DE CONSTRUÇÃO (INFERIOR) ================= -->
<div id="build-bar">
  <button class="build-btn" id="btn-shovel"><span class="build-icon">🪏</span><span class="build-label" data-i18n="build.shovel">Pá</span></button>
  <button class="build-btn hidden" id="btn-till"><span class="build-icon">⛏️</span><span class="build-label" data-i18n="build.till">Arar</span></button>
  <button class="build-btn hidden" id="btn-plant"><span class="build-icon">🌱</span><span class="build-label" data-i18n="build.plant">Plantar</span></button>
  <button class="build-btn hidden" id="btn-plantall"><span class="build-icon">🌾</span><span class="build-label" data-i18n="build.plantAll">Plantar Tudo</span></button>
  <button class="build-btn hidden" id="btn-fert"><span class="build-icon">💩</span><span class="build-label" data-i18n="build.fert">Fertilizar</span></button>
  <button class="build-btn hidden" id="btn-water"><span class="build-icon">💧</span><span class="build-label" data-i18n="build.water">Regar</span></button>
  <button class="build-btn hidden" id="btn-harvestall"><span class="build-icon">🧺</span><span class="build-label" data-i18n="build.harvestAll">Colher Tudo</span></button>
  <button class="build-btn hidden" id="btn-collectall"><span class="build-icon">🥚</span><span class="build-label" data-i18n="build.collectAll">Recolher</span></button>
  <button class="build-btn hidden" id="btn-pen"><span class="build-icon">🚧</span><span class="build-label" data-i18n="build.pen">Curral</span></button>
  <button class="build-btn hidden" id="btn-plot"><span class="build-icon">🟫</span><span class="build-label" data-i18n="build.plot">Lote</span></button>
  <button class="build-btn hidden" id="btn-dog"><span class="build-icon">🐕</span><span class="build-label" data-i18n="build.dog">Cachorro</span></button>
  <button class="build-btn hidden" id="btn-tractor"><span class="build-icon">🚜</span><span class="build-label" data-i18n="build.tractor">Trator</span></button>
  <button class="build-btn hidden" id="btn-fish"><span class="build-icon">🎣</span><span class="build-label" data-i18n="build.fish">Pescar</span></button>
</div>

<!-- Setas de navegacao da barra de ferramentas (3 visiveis por vez) -->
<button class="bar-arrow" id="bar-arrow-left" aria-label="Ferramentas anteriores">◀</button>
<button class="bar-arrow" id="bar-arrow-right" aria-label="Próximas ferramentas">▶</button>

<!-- Botões de minimizar as colunas de ferramentas -->
<button id="btn-collapse-left" class="collapse-btn" title="Minimizar menus"><span class="collapse-arrow">▼</span></button>
<button id="btn-collapse-right" class="collapse-btn" title="Minimizar ferramentas"><span class="collapse-arrow">▼</span></button>

<!-- Diagnostico: versao + zoom ao vivo -->
<div id="debug-badge">v48</div>

<!-- Barra de sementes (modo plantar) -->
<div id="seed-bar" class="hidden"></div>

<!-- Barra de confirmação flutuante (construir / mover / girar) -->
<div id="confirm-bar" class="hidden">
  <span id="confirm-info"></span>
  <button id="confirm-ok" class="btn-ok">✓ Confirmar</button>
  <button id="confirm-cancel" class="btn-cancel">✕ Cancelar</button>
</div>

<!-- Menu de contexto em volta da construcao selecionada -->
<div id="bctx" style="display:none">
  <button class="bctx-btn" id="bctx-move" title="Mover">&#x1F590;&#xFE0F;</button>
  <button class="bctx-btn" id="bctx-rotate" title="Girar">&#x21BB;</button>
  <button class="bctx-btn" id="bctx-panel" title="Gerenciar">&#x1F4CA;</button>
  <button class="bctx-btn" id="bctx-remove" title="Remover">&#x2716;&#xFE0F;</button>
</div>

<!-- Toast de avisos -->
<div id="toast" class="hidden"></div>

<!-- ================= PAINÉIS MODAIS ================= -->
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <div id="modal-header">
      <span id="modal-title">Título</span>
      <button id="modal-close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Diálogo de confirmação (remover etc.) -->
<div id="dialog-overlay" class="hidden">
  <div id="dialog">
    <div id="dialog-text"></div>
    <div id="dialog-buttons">
      <button id="dialog-cancel" class="btn-cancel" data-i18n="dialog.cancel">Cancelar</button>
      <button id="dialog-ok" class="btn-ok" data-i18n="dialog.ok">Confirmar</button>
    </div>
  </div>
</div>

<script src="js/data.js?v=48"></script>
<script src="js/iso.js?v=48"></script>
<script src="js/game.js?v=48"></script>
<script src="js/render.js?v=48"></script>
<script src="js/animals.js?v=48"></script>
<script src="js/farmers.js?v=48"></script>
<script src="js/ui.js?v=48"></script>
<script src="js/multiplayer.js?v=48"></script>
<script src="js/main.js?v=48"></script>
</body>
</html>
